<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>

  <!-- Face -->
  <circle cx="50" cy="45" r="25" fill="url(#faceGradient)"/>

  <!-- Hair -->
  <ellipse cx="50" cy="30" rx="28" ry="18" fill="#5b4636"/>
  <ellipse cx="30" cy="40" rx="8" ry="15" fill="#5b4636"/>
  <ellipse cx="70" cy="40" rx="8" ry="15" fill="#5b4636"/>

  <!-- Eyes -->
  <ellipse cx="40" cy="45" rx="4" ry="5" fill="#1e293b"/>
  <ellipse cx="60" cy="45" rx="4" ry="5" fill="#1e293b"/>
  <circle cx="41" cy="44" r="1.5" fill="white"/>
  <circle cx="61" cy="44" r="1.5" fill="white"/>

  <!-- Smile -->
  <path d="M 40 55 Q 50 62 60 55" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="35" cy="52" rx="4" ry="2" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="65" cy="52" rx="4" ry="2" fill="#fca5a5" opacity="0.5"/>

  <!-- AI sparkle -->
  <circle cx="78" cy="22" r="6" fill="white" opacity="0.9"/>
  <path d="M 78 16 L 78 28 M 72 22 L 84 22" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
</svg>
