<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background panel -->
  <rect x="10" y="10" width="180" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="20" y="20" width="160" height="20" rx="4" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Content lines -->
  <rect x="20" y="50" width="120" height="4" rx="2" fill="#94a3b8"/>
  <rect x="20" y="60" width="140" height="4" rx="2" fill="#94a3b8"/>
  <rect x="20" y="70" width="100" height="4" rx="2" fill="#94a3b8"/>
  <rect x="20" y="80" width="130" height="4" rx="2" fill="#94a3b8"/>
  
  <!-- Small decorative elements -->
  <circle cx="170" cy="30" r="6" fill="#10b981" opacity="0.7"/>
  <circle cx="155" cy="30" r="6" fill="#f59e0b" opacity="0.7"/>
  <circle cx="140" cy="30" r="6" fill="#ef4444" opacity="0.7"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="leftboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="100" rx="8" fill="url(#leftboardGradient)"/>
</svg>