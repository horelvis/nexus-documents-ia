<svg viewBox="0 0 180 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background card -->
  <rect x="5" y="5" width="170" height="90" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  
  <!-- Chart area background -->
  <rect x="15" y="20" width="150" height="60" rx="6" fill="#f9fafb"/>
  
  <!-- Chart bars -->
  <rect x="25" y="45" width="8" height="25" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="40" y="35" width="8" height="35" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="55" y="50" width="8" height="20" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="70" y="30" width="8" height="40" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="85" y="40" width="8" height="30" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="100" y="25" width="8" height="45" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="115" y="45" width="8" height="25" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <rect x="130" y="35" width="8" height="35" rx="4" fill="#8b5cf6" opacity="0.8"/>
  
  <!-- Stats indicators -->
  <circle cx="155" cy="25" r="3" fill="#10b981"/>
  <text x="160" y="28" font-family="Arial, sans-serif" font-size="8" fill="#374151">98%</text>
  
  <circle cx="155" cy="40" r="3" fill="#f59e0b"/>
  <text x="160" y="43" font-family="Arial, sans-serif" font-size="8" fill="#374151">76%</text>
  
  <!-- Title area -->
  <rect x="15" y="10" width="60" height="6" rx="3" fill="#6b7280" opacity="0.6"/>
  
  <!-- Shadow effect -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="170" height="90" rx="12" fill="none" filter="url(#shadow)"/>
</svg>