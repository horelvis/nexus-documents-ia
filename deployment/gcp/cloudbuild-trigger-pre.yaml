# Cloud Build Trigger Configuration for PRE environment
# This builds and deploys only compiled artifacts, no source code

substitutions:
  _REGION: europe-west1
  _SERVICE_ACCOUNT: nexus-cloud-run-pre@nexusdocs360-pre.iam.gserviceaccount.com
  _ENVIRONMENT: pre
  _NODE_VERSION: '18'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Build Frontend (compiled only)
  - name: 'node:${_NODE_VERSION}'
    id: 'build-frontend'
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📦 Installing dependencies..."
        npm ci --production=false
        
        echo "🔨 Building frontend for PRE..."
        cat > .env.production.local << EOF
        NEXT_PUBLIC_API_URL=https://pre-api.nexusdocs360.com
        NEXT_PUBLIC_APP_URL=https://pre-app.nexusdocs360.com
        NEXT_PUBLIC_ENVIRONMENT=pre
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY_PRE
        EOF
        
        npm run build
        
        echo "📊 Build stats:"
        du -sh .next
        
        # Create minimal production image
        cat > Dockerfile.compiled << 'DOCKERFILE'
        FROM node:18-alpine AS runner
        WORKDIR /app
        
        ENV NODE_ENV production
        ENV NEXT_TELEMETRY_DISABLED 1
        
        RUN addgroup --system --gid 1001 nodejs
        RUN adduser --system --uid 1001 nextjs
        
        # Copy only necessary files
        COPY --chown=nextjs:nodejs .next/standalone ./
        COPY --chown=nextjs:nodejs .next/static ./.next/static
        COPY --chown=nextjs:nodejs public ./public
        
        USER nextjs
        EXPOSE 3000
        ENV PORT 3000
        
        CMD ["node", "server.js"]
        DOCKERFILE
    secretEnv: ['CLERK_PUBLISHABLE_KEY_PRE']

  # Step 2: Build Backend (without source)
  - name: 'python:3.9-slim'
    id: 'build-backend'
    dir: 'backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📦 Creating optimized backend build..."
        
        # Install dependencies
        pip install --upgrade pip
        pip install wheel setuptools
        pip install -r requirements.txt
        
        # Compile Python files
        python -m compileall -b app/
        
        # Remove source files, keep only compiled
        find app/ -name "*.py" -type f -delete
        find app/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # Create production Dockerfile
        cat > Dockerfile.compiled << 'DOCKERFILE'
        FROM python:3.9-slim
        
        WORKDIR /app
        
        # Install runtime dependencies only
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt && \
            rm -rf /root/.cache/pip
        
        # Copy only compiled Python files
        COPY app app/
        COPY alembic alembic/
        COPY alembic.ini .
        
        # Non-root user
        RUN useradd -m -u 1001 appuser && chown -R appuser:appuser /app
        USER appuser
        
        EXPOSE 8000
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        DOCKERFILE

  # Step 3: Build microservices (compiled)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'prepare-microservices'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        for service in langchain-service langroid-service storage-service; do
          echo "Preparing $$service..."
          cd microservices/$$service
          
          # Compile Python
          python -m compileall -b app/
          find app/ -name "*.py" -type f -delete
          
          cd ../..
        done

  # Step 4: Build and push all images
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-images'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Frontend image
        docker build -f frontend/Dockerfile.compiled \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/frontend:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/frontend:latest \
          frontend/
        
        # Backend image
        docker build -f backend/Dockerfile.compiled \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/api:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/api:latest \
          backend/
        
        # Push all images
        docker push --all-tags ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/frontend
        docker push --all-tags ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/api

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying services to PRE..."
        
        # Deploy Frontend
        gcloud run deploy nexus-frontend-pre \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/frontend:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --min-instances=1 \
          --max-instances=3 \
          --cpu=1 \
          --memory=1Gi \
          --set-env-vars="NODE_ENV=production"
        
        # Deploy Backend
        gcloud run deploy nexus-api-pre \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexusdocs360-pre/api:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --min-instances=1 \
          --max-instances=5 \
          --cpu=2 \
          --memory=2Gi \
          --set-secrets="DATABASE_URL=database-url-pre:latest" \
          --set-env-vars="ENVIRONMENT=pre,PYTHONUNBUFFERED=1"

  # Step 6: Run smoke tests
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'smoke-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running smoke tests..."
        
        # Get service URLs
        FRONTEND_URL=$(gcloud run services describe nexus-frontend-pre --region=${_REGION} --format='value(status.url)')
        API_URL=$(gcloud run services describe nexus-api-pre --region=${_REGION} --format='value(status.url)')
        
        # Test endpoints
        curl -f $$FRONTEND_URL || exit 1
        curl -f $$API_URL/health || exit 1
        
        echo "✅ Deployment successful!"

# Secrets needed
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/clerk-publishable-key-pre/versions/latest
      env: 'CLERK_PUBLISHABLE_KEY_PRE'

# Artifacts to store
artifacts:
  objects:
    location: 'gs://nexusdocs360-pre-builds/${BUILD_ID}'
    paths:
      - 'frontend/.next/build-manifest.json'
      - 'frontend/.next/BUILD_ID'