# Cloud Monitoring Dashboard Configuration for NexusDocs360 PRE
# This dashboard provides comprehensive monitoring for the PRE environment

displayName: "NexusDocs360 PRE - Overview Dashboard"
mosaicLayout:
  columns: 12
  tiles:
    # Title Section
    - width: 12
      height: 2
      widget:
        title: "🚀 NexusDocs360 PRE Environment - Real-time Monitoring"
        text:
          content: |
            **Environment**: PRE (Pre-Production)
            **Region**: europe-west1
            **Last Updated**: Auto-refreshing every 60s
            
            Critical services: Frontend | API | LangChain | Langroid | Storage | Databases

    # Service Health Overview
    - width: 4
      height: 4
      widget:
        title: "Service Health Status"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="cloud_run_revision"
                resource.labels.service_name=~"nexus-.*-pre"
                metric.type="run.googleapis.com/request_count"
              aggregation:
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_RATE
                crossSeriesReducer: REDUCE_SUM
                groupByFields:
                  - resource.label.service_name
          thresholds:
            - value: 0
              color: RED
              direction: BELOW
            - value: 1
              color: GREEN
              direction: ABOVE

    # Error Rate
    - width: 4
      height: 4
      widget:
        title: "Error Rate %"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="cloud_run_revision"
                resource.labels.service_name=~"nexus-.*-pre"
                metric.type="run.googleapis.com/request_count"
                metric.labels.response_code_class!="2xx"
              aggregation:
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_RATE
                crossSeriesReducer: REDUCE_SUM
          thresholds:
            - value: 5
              color: YELLOW
              direction: ABOVE
            - value: 10
              color: RED
              direction: ABOVE

    # Request Latency
    - width: 4
      height: 4
      widget:
        title: "P95 Latency (ms)"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="cloud_run_revision"
                resource.labels.service_name=~"nexus-.*-pre"
                metric.type="run.googleapis.com/request_latencies"
              aggregation:
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_PERCENTILE_95
                crossSeriesReducer: REDUCE_MAX
          thresholds:
            - value: 2000
              color: YELLOW
              direction: ABOVE
            - value: 5000
              color: RED
              direction: ABOVE

    # Request Rate Chart
    - width: 6
      height: 4
      yPos: 6
      widget:
        title: "Request Rate by Service"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name=~"nexus-.*-pre"
                    metric.type="run.googleapis.com/request_count"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_RATE
                    groupByFields:
                      - resource.label.service_name
              plotType: LINE
              targetAxis: Y1
          timeshiftDuration: 0s
          yAxis:
            label: "requests/sec"
            scale: LINEAR

    # Latency Distribution
    - width: 6
      height: 4
      xPos: 6
      yPos: 6
      widget:
        title: "Latency Distribution (P50, P95, P99)"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name="nexus-api-pre"
                    metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_50
              plotType: LINE
              targetAxis: Y1
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name="nexus-api-pre"
                    metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_95
              plotType: LINE
              targetAxis: Y1
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name="nexus-api-pre"
                    metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_99
              plotType: LINE
              targetAxis: Y1
          yAxis:
            label: "latency (ms)"
            scale: LINEAR

    # CPU Utilization
    - width: 6
      height: 4
      yPos: 10
      widget:
        title: "CPU Utilization by Service"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name=~"nexus-.*-pre"
                    metric.type="run.googleapis.com/container/cpu/utilizations"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_MEAN
                    groupByFields:
                      - resource.label.service_name
              plotType: LINE
              targetAxis: Y1
          yAxis:
            label: "CPU %"
            scale: LINEAR

    # Memory Utilization
    - width: 6
      height: 4
      xPos: 6
      yPos: 10
      widget:
        title: "Memory Utilization by Service"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name=~"nexus-.*-pre"
                    metric.type="run.googleapis.com/container/memory/utilizations"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_MEAN
                    groupByFields:
                      - resource.label.service_name
              plotType: LINE
              targetAxis: Y1
          yAxis:
            label: "Memory %"
            scale: LINEAR

    # Database Connections
    - width: 4
      height: 4
      yPos: 14
      widget:
        title: "Database Connections"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloudsql_database"
                    resource.labels.database_id=~".*nexus-db-pre"
                    metric.type="cloudsql.googleapis.com/database/postgresql/num_backends"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_MEAN
              plotType: LINE
              targetAxis: Y1
          yAxis:
            label: "connections"
            scale: LINEAR

    # Database CPU
    - width: 4
      height: 4
      xPos: 4
      yPos: 14
      widget:
        title: "Database CPU Usage"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="cloudsql_database"
                resource.labels.database_id=~".*nexus-db-pre"
                metric.type="cloudsql.googleapis.com/database/cpu/utilization"
              aggregation:
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_MEAN
          thresholds:
            - value: 0.7
              color: YELLOW
              direction: ABOVE
            - value: 0.9
              color: RED
              direction: ABOVE

    # Redis Memory
    - width: 4
      height: 4
      xPos: 8
      yPos: 14
      widget:
        title: "Redis Memory Usage"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="redis_instance"
                resource.labels.instance_id="nexus-redis-pre"
                metric.type="redis.googleapis.com/stats/memory/usage"
              aggregation:
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_MEAN
          thresholds:
            - value: 0.8
              color: YELLOW
              direction: ABOVE
            - value: 0.95
              color: RED
              direction: ABOVE

    # AI Service Metrics
    - width: 6
      height: 4
      yPos: 18
      widget:
        title: "AI Service Response Times"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name=~"nexus-(langchain|langroid)-pre"
                    metric.type="run.googleapis.com/request_latencies"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_95
                    groupByFields:
                      - resource.label.service_name
              plotType: LINE
              targetAxis: Y1
          yAxis:
            label: "latency (ms)"
            scale: LINEAR

    # AI Token Usage
    - width: 6
      height: 4
      xPos: 6
      yPos: 18
      widget:
        title: "AI Token Usage Rate"
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |
                    resource.type="cloud_run_revision"
                    resource.labels.service_name=~"nexus-(langchain|langroid)-pre"
                    metric.type="logging.googleapis.com/user/ai_tokens_used"
                  aggregation:
                    alignmentPeriod: 300s
                    perSeriesAligner: ALIGN_RATE
                    crossSeriesReducer: REDUCE_SUM
              plotType: STACKED_BAR
              targetAxis: Y1
          yAxis:
            label: "tokens/min"
            scale: LINEAR

    # Error Logs
    - width: 12
      height: 4
      yPos: 22
      widget:
        title: "Recent Error Logs"
        logsPanel:
          filter: |
            resource.type="cloud_run_revision"
            resource.labels.service_name=~"nexus-.*-pre"
            severity>=ERROR
          resourceNames:
            - projects/nexusdocs360-pre

    # Active Instances
    - width: 4
      height: 3
      yPos: 26
      widget:
        title: "Active Cloud Run Instances"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="cloud_run_revision"
                resource.labels.service_name=~"nexus-.*-pre"
                metric.type="run.googleapis.com/container/instance_count"
              aggregation:
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_MAX
                crossSeriesReducer: REDUCE_SUM

    # Cold Start Count
    - width: 4
      height: 3
      xPos: 4
      yPos: 26
      widget:
        title: "Cold Starts (last hour)"
        scorecard:
          timeSeriesQuery:
            timeSeriesFilter:
              filter: |
                resource.type="cloud_run_revision"
                resource.labels.service_name=~"nexus-.*-pre"
                metric.type="run.googleapis.com/container/startup_latencies"
              aggregation:
                alignmentPeriod: 3600s
                perSeriesAligner: ALIGN_COUNT

    # Cost Estimate
    - width: 4
      height: 3
      xPos: 8
      yPos: 26
      widget:
        title: "Estimated Daily Cost"
        text:
          content: |
            **PRE Environment Cost**
            - Cloud Run: ~$5/day
            - Cloud SQL: ~$2/day  
            - Redis: ~$1/day
            - Storage: ~$1/day
            **Total: ~$9/day**