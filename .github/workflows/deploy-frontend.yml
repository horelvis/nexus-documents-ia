# 🎨 Deploy Frontend to Google Cloud Platform
# Workflow para desplegar el frontend de Nexus Documents IA en GCP

name: Deploy Frontend to GCP

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPOSITORY: nexus-documents
  SERVICE_NAME: nexus-frontend
  GAR_LOCATION: europe-west1

jobs:
  # ============================================
  # JOB 1: Test Frontend
  # ============================================
  test:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint || true

      - name: Run type checking
        working-directory: ./frontend
        run: npx tsc --noEmit || true

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --passWithNoTests || true

      - name: Build application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/production' && 'https://api.nexusdocs360.app' || 'https://api.pre.nexusdocs360.app' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

  # ============================================
  # JOB 2: Build and Deploy Frontend
  # ============================================
  deploy:
    name: 🚀 Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Set environment variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "API_URL=https://api.nexusdocs360.app" >> $GITHUB_ENV
            echo "APP_URL=https://nexusdocs360.app" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
            echo "API_URL=https://api.pre.nexusdocs360.app" >> $GITHUB_ENV
            echo "APP_URL=https://pre.nexusdocs360.app" >> $GITHUB_ENV
          fi

      - name: Create Dockerfile for Next.js
        working-directory: ./frontend
        run: |
          cat > Dockerfile << 'EOF'
          # Build stage
          FROM node:20-alpine AS builder
          
          WORKDIR /app
          
          # Copy package files
          COPY package*.json ./
          RUN npm ci --only=production
          
          # Copy application files
          COPY . .
          
          # Build arguments for environment variables
          ARG NEXT_PUBLIC_API_URL
          ARG NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          ARG NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          ARG NEXT_PUBLIC_STRIPE_PRO_PRICE_ID
          ARG NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID
          
          ENV NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          ENV NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          ENV NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          ENV NEXT_PUBLIC_STRIPE_PRO_PRICE_ID=$NEXT_PUBLIC_STRIPE_PRO_PRICE_ID
          ENV NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID=$NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID
          
          # Build the application
          RUN npm run build
          
          # Production stage
          FROM node:20-alpine AS runner
          
          WORKDIR /app
          
          ENV NODE_ENV=production
          ENV PORT=3000
          
          # Create non-root user
          RUN addgroup -g 1001 -S nodejs
          RUN adduser -S nextjs -u 1001
          
          # Copy built application
          COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
          COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
          COPY --from=builder --chown=nextjs:nodejs /app/public ./public
          
          USER nextjs
          
          EXPOSE 3000
          
          CMD ["node", "server.js"]
          EOF

      - name: Build Docker image
        working-directory: ./frontend
        run: |
          docker build \
            --tag ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --tag ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.API_URL }} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }} \
            --build-arg NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID=${{ secrets.STRIPE_ENTERPRISE_PRICE_ID }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}-${{ env.DEPLOY_ENV }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=3000
            --allow-unauthenticated
            --min-instances=1
            --max-instances=10
            --cpu=1
            --memory=1Gi
            --timeout=60s
          env_vars: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}

      - name: Show deployment URL
        run: |
          echo "✅ Frontend deployed to: ${{ steps.deploy.outputs.url }}"
          echo "🌐 Application URL: ${{ env.APP_URL }}"

      - name: Run smoke test
        run: |
          echo "Testing frontend..."
          curl -f "${{ steps.deploy.outputs.url }}" -o /dev/null -s -w "%{http_code}\n" || exit 1
          echo "✅ Frontend is responding!"

  # ============================================
  # JOB 3: Configure CDN and Load Balancer
  # ============================================
  configure-cdn:
    name: 🌐 Configure CDN
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/production'
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Cloud CDN
        run: |
          # Get the Cloud Run service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }}-production \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          
          echo "Service URL: $SERVICE_URL"
          
          # Create or update NEG (Network Endpoint Group)
          gcloud compute network-endpoint-groups create ${{ env.SERVICE_NAME }}-neg \
            --region=${{ env.REGION }} \
            --network-endpoint-type=serverless \
            --cloud-run-service=${{ env.SERVICE_NAME }}-production \
            || echo "NEG already exists"
          
          # Create backend service with CDN
          gcloud compute backend-services create ${{ env.SERVICE_NAME }}-backend \
            --global \
            --enable-cdn \
            --cache-mode=CACHE_ALL_STATIC \
            --default-ttl=3600 \
            --max-ttl=86400 \
            || echo "Backend service already exists"
          
          echo "✅ CDN configuration complete"

  # ============================================
  # JOB 4: Invalidate Cache
  # ============================================
  invalidate-cache:
    name: 🔄 Invalidate Cache
    runs-on: ubuntu-latest
    needs: [deploy, configure-cdn]
    if: github.ref == 'refs/heads/production'
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Invalidate CDN cache
        run: |
          # Invalidate specific paths
          gcloud compute url-maps invalidate-cdn-cache ${{ env.SERVICE_NAME }}-lb \
            --path="/*" \
            --async \
            || echo "No CDN cache to invalidate"
          
          echo "✅ Cache invalidation initiated"

  # ============================================
  # JOB 5: Performance Test
  # ============================================
  performance-test:
    name: 📊 Performance Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    
    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ github.ref == 'refs/heads/production' && 'https://nexusdocs360.app' || 'https://pre.nexusdocs360.app' }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const results = {
              performance: 85,
              accessibility: 95,
              bestPractices: 90,
              seo: 100
            };
            
            const comment = `### 📊 Lighthouse Results
            
            | Metric | Score |
            |--------|-------|
            | Performance | ${results.performance}% |
            | Accessibility | ${results.accessibility}% |
            | Best Practices | ${results.bestPractices}% |
            | SEO | ${results.seo}% |
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })