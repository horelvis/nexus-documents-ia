name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: TypeScript type check
      working-directory: ./frontend
      run: npm run type-check || npx tsc --noEmit

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install black flake8 mypy isort

    - name: Run Black
      working-directory: ./backend
      run: black --check app/

    - name: Run Flake8
      working-directory: ./backend
      run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503

    - name: Run isort
      working-directory: ./backend
      run: isort --check-only app/

    - name: Run MyPy
      working-directory: ./backend
      run: mypy app/ || true  # Don't fail on type errors for now

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false || true

    - name: Build check
      working-directory: ./frontend
      run: npm run build

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      weaviate:
        image: semitechnologies/weaviate:latest
        ports:
          - 8080:8080
        env:
          QUERY_DEFAULTS_LIMIT: 25
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'

      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          "ES_JAVA_OPTS": "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
          - 9300:9300

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio requests psutil

    - name: Wait for services
      run: |
        echo "⏳ Waiting for services..."
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U test_user && \
             redis-cli -h localhost -p 6379 ping | grep -q PONG && \
             curl -s http://localhost:8080/v1/meta > /dev/null && \
             curl -s http://localhost:9200/_cluster/health > /dev/null; then
            echo "✅ All services ready"
            break
          fi
          sleep 2
        done

    - name: Run system validation
      run: python3 validate_system.py

    - name: Run integration tests
      working-directory: ./backend/tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key
        CLERK_SECRET_KEY: test-clerk-secret
        WEAVIATE_URL: http://localhost:8080
        ELASTICSEARCH_URL: http://localhost:9200
        TESTING: true
      run: |
        python3 test_validation_simple.py

    - name: Run unit tests with coverage
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key
        CLERK_SECRET_KEY: test-clerk-secret
        TESTING: true
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70 || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check Python dependencies
      working-directory: ./backend
      run: |
        pip install safety
        safety check -r requirements.txt || true

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: nexus-api:pr-${{ github.event.pull_request.number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: nexus-frontend:pr-${{ github.event.pull_request.number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, test-frontend, test-backend, security-scan, build-check]
    if: always()
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          const jobStatuses = jobs.jobs.map(job => ({
            name: job.name,
            status: job.conclusion || 'in_progress',
            url: job.html_url
          }));
          
          const checkMark = (status) => status === 'success' ? '✅' : status === 'failure' ? '❌' : '⏳';
          
          const comment = `## 🔍 PR Validation Results
          
          | Check | Status | Details |
          |-------|--------|---------|
          ${jobStatuses.map(job => `| ${job.name} | ${checkMark(job.status)} | [View](${job.url}) |`).join('\n')}
          
          ### 📋 Summary
          - **PR Number**: #${{ github.event.pull_request.number }}
          - **Branch**: ${{ github.head_ref }}
          - **Target**: ${{ github.base_ref }}
          
          ### 🚀 Next Steps
          ${jobStatuses.every(job => job.status === 'success') ? 
            '✅ All checks passed! This PR is ready for review.' : 
            '❌ Some checks failed. Please fix the issues before merging.'}
          `;
          
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: comment
          });

  status-check:
    name: Overall Status
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, test-frontend, test-backend, security-scan, build-check]
    if: always()
    
    steps:
    - name: Check Status
      run: |
        if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
          echo "❌ PR validation failed"
          exit 1
        else
          echo "✅ PR validation passed"
        fi