name: Deploy to PRE Environment

on:
  push:
    branches:
      - pre
  workflow_dispatch:

env:
  PROJECT_ID: nexusdocs360-pre
  REGION: europe-west1
  GAR_LOCATION: europe-west1-docker.pkg.dev
  REPOSITORY: nexusdocs360-pre

jobs:
  setup-build-deploy:
    name: Setup, Build, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Authenticate to Google Cloud using Workload Identity Federation
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY_PRE }}'

    # Setup gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Configure Docker to use gcloud as a credential helper
    - name: Configure Docker
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}

    # Build and push Backend images
    - name: Build and Push Backend
      run: |
        cd backend
        docker build -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
          -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest \
          -f Dockerfile.prod \
          .
        docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
        docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest

    # Build and push Frontend image
    - name: Build and Push Frontend
      run: |
        cd frontend
        docker build -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
          -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest \
          --build-arg NEXT_PUBLIC_API_URL=https://pre-api.nexusdocs360.app \
          --build-arg NEXT_PUBLIC_APP_URL=https://pre.nexusdocs360.app \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY_PRE }} \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL=/auth/sign-in \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL=/auth/sign-up \
          --build-arg NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/dashboard \
          --build-arg NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/onboarding \
          -f Dockerfile.prod \
          .
        docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
        docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest

    # Deploy Backend to Cloud Run
    - name: Deploy Backend to Cloud Run
      run: |
        gcloud run deploy nexus-backend-pre \
          --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --port 8000 \
          --allow-unauthenticated \
          --vpc-connector nexus-connector-pre \
          --vpc-egress private-ranges-only \
          --service-account nexus-cloud-run-pre@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
          --set-env-vars "ENVIRONMENT=pre" \
          --set-secrets "DATABASE_URL=database-url-pre:latest,ASYNC_DATABASE_URL=async-database-url-pre:latest,REDIS_URL=redis-url-pre:latest,CLERK_SECRET_KEY=clerk-secret-pre:latest,STRIPE_SECRET_KEY=stripe-secret-pre:latest,MICROSERVICES_API_KEY=microservices-api-key-pre:latest" \
          --min-instances 1 \
          --max-instances 3 \
          --memory 1Gi \
          --cpu 1

    # Deploy Frontend to Cloud Run
    - name: Deploy Frontend to Cloud Run
      run: |
        gcloud run deploy nexus-frontend-pre \
          --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --port 3000 \
          --allow-unauthenticated \
          --service-account nexus-cloud-run-pre@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
          --set-env-vars "NODE_ENV=production,ENVIRONMENT=pre" \
          --set-secrets "CLERK_SECRET_KEY=clerk-secret-pre:latest" \
          --min-instances 1 \
          --max-instances 3 \
          --memory 512Mi \
          --cpu 1

    # Deploy Microservices
    - name: Deploy Storage Service
      run: |
        cd backend/microservices/storage-service
        docker build -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/storage-service:latest \
          -f Dockerfile \
          .
        docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/storage-service:latest
        
        gcloud run deploy storage-service-pre \
          --image ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/storage-service:latest \
          --region ${{ env.REGION }} \
          --platform managed \
          --port 8001 \
          --allow-unauthenticated \
          --vpc-connector nexus-connector-pre \
          --vpc-egress private-ranges-only \
          --service-account nexus-cloud-run-pre@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
          --set-secrets "GCS_CREDENTIALS=gcs-credentials-pre:latest,MICROSERVICES_API_KEY=microservices-api-key-pre:latest" \
          --memory 512Mi

    # Update Nginx configuration with Cloud Run URLs
    - name: Update Nginx Configuration
      run: |
        BACKEND_URL=$(gcloud run services describe nexus-backend-pre --region=${{ env.REGION }} --format='value(status.url)')
        FRONTEND_URL=$(gcloud run services describe nexus-frontend-pre --region=${{ env.REGION }} --format='value(status.url)')
        
        echo "Backend URL: $BACKEND_URL"
        echo "Frontend URL: $FRONTEND_URL"
        
        # Update Nginx configuration
        gcloud compute ssh nginx-proxy-pre --zone=europe-west1-b --command="
          # Update upstream configuration
          sudo sed -i \"s|server .*;|server \${BACKEND_URL#https://};|\" /etc/nginx/sites-available/nexusdocs360-pre
          sudo nginx -s reload
        " || echo "Note: Nginx update failed. Instance may need to be created with create-nginx-proxy-pre.sh"

    # Send notification
    - name: Deployment Notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to PRE environment completed successfully!"
          echo "🌐 Frontend: https://pre.nexusdocs360.app"
          echo "🔧 API: https://pre-api.nexusdocs360.app"
        else
          echo "❌ Deployment to PRE environment failed!"
        fi