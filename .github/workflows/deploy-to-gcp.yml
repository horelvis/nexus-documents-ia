# 🚀 Deploy to Google Cloud Platform
# Workflow automático para desplegar Nexus Documents IA en GCP

name: Deploy to GCP

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPOSITORY: nexus-documents
  BACKEND_SERVICE: nexus-backend
  FRONTEND_SERVICE: nexus-frontend
  
jobs:
  # ============================================
  # JOB 1: Security Scan
  # ============================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        run: |
          if grep -q "CRITICAL" trivy-results.sarif; then
            echo "❌ Critical vulnerabilities found"
            exit 1
          fi
          echo "✅ No critical vulnerabilities found"

  # ============================================
  # JOB 2: Build and Test Backend
  # ============================================
  build-backend:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ./backend
        env:
          TESTING: true
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:latest \
            -f docker/Dockerfile .

      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:latest

  # ============================================
  # JOB 3: Build and Test Frontend
  # ============================================
  build-frontend:
    name: 🎨 Build Frontend
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm run test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Build application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.pre.nexusdocs360.app
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        working-directory: ./frontend
        run: |
          docker build \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:latest \
            --build-arg NEXT_PUBLIC_API_URL=https://api.pre.nexusdocs360.app \
            .

      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:latest

  # ============================================
  # JOB 4: Deploy to Cloud Run
  # ============================================
  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    
    environment:
      name: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
      url: ${{ steps.deploy-frontend.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }}-${{ github.ref == 'refs/heads/production' && 'prod' || 'staging' }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 1 \
            --max-instances 10 \
            --set-env-vars "ENVIRONMENT=${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}" \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --set-secrets "REDIS_HOST=redis-host:latest" \
            --set-secrets "CLERK_SECRET_KEY=clerk-secret-key:latest" \
            --set-secrets "STRIPE_SECRET_KEY=stripe-secret-key:latest" \
            --set-secrets "GCS_CREDENTIALS=gcs-credentials:latest" \
            --set-secrets "MICROSERVICES_API_KEY=microservices-api-key:latest" \
            --set-secrets "SIGNATURE_ENCRYPTION_KEY=signature-encryption-key:latest"

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }}-${{ github.ref == 'refs/heads/production' && 'prod' || 'staging' }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --cpu 1 \
            --memory 1Gi \
            --min-instances 1 \
            --max-instances 5 \
            --set-env-vars "NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }}"

      - name: Run smoke tests
        run: |
          BACKEND_URL="${{ steps.deploy-backend.outputs.url }}"
          FRONTEND_URL="${{ steps.deploy-frontend.outputs.url }}"
          
          echo "Testing Backend at: $BACKEND_URL"
          curl -f "$BACKEND_URL/health" || exit 1
          
          echo "Testing Frontend at: $FRONTEND_URL"
          curl -f "$FRONTEND_URL" || exit 1
          
          echo "✅ Smoke tests passed!"

  # ============================================
  # JOB 5: Database Migrations
  # ============================================
  run-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Run migrations via Cloud Run Job
        run: |
          gcloud run jobs create migrate-${{ github.sha }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --command "alembic" \
            --args "upgrade,head" \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --max-retries 3 \
            --parallelism 1 \
            --task-timeout 600
          
          gcloud run jobs execute migrate-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --wait

  # ============================================
  # JOB 6: Cleanup Old Resources
  # ============================================
  cleanup:
    name: 🧹 Cleanup Old Resources
    runs-on: ubuntu-latest
    needs: [deploy, run-migrations]
    if: always()
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Delete old images from Artifact Registry
        run: |
          # Keep only the last 5 images
          gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }} \
            --include-tags \
            --limit=999 \
            --sort-by=~CREATE_TIME \
            --format="get(version)" | \
            tail -n +6 | \
            xargs -I {} gcloud artifacts docker images delete \
              ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}@{} \
              --quiet || true

      - name: Clean up old Cloud Run revisions
        run: |
          # Keep only the last 3 revisions
          for SERVICE in ${{ env.BACKEND_SERVICE }}-${{ github.ref == 'refs/heads/production' && 'prod' || 'staging' }} ${{ env.FRONTEND_SERVICE }}-${{ github.ref == 'refs/heads/production' && 'prod' || 'staging' }}; do
            gcloud run revisions list \
              --service=$SERVICE \
              --region=${{ env.REGION }} \
              --format="value(name)" | \
              tail -n +4 | \
              xargs -I {} gcloud run revisions delete {} \
                --region=${{ env.REGION }} \
                --quiet || true
          done

  # ============================================
  # JOB 7: Notify Status
  # ============================================
  notify:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, run-migrations]
    if: always()
    
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to ${{ github.ref == 'refs/heads/production' && 'PRODUCTION' || 'STAGING' }}
            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: '#deployments'