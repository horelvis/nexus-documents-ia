name: Deploy Full Stack to PRE Environment

on:
  push:
    branches:
      - pre
    paths-ignore:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend Services'
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend Application'
        required: false
        type: boolean
        default: true

jobs:
  deploy-backend:
    if: ${{ github.event_name == 'push' || inputs.deploy_backend == true }}
    name: Deploy Backend
    uses: ./.github/workflows/deploy-backend-pre.yml
    secrets: inherit

  deploy-frontend:
    if: ${{ github.event_name == 'push' || inputs.deploy_frontend == true }}
    name: Deploy Frontend
    needs: deploy-backend
    uses: ./.github/workflows/deploy-frontend-pre.yml
    secrets: inherit
    with:
      backend_url: ${{ needs.deploy-backend.outputs.backend_url }}

  notify-completion:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
    - name: Final Deployment Status
      run: |
        echo "📊 Full Stack Deployment Summary:"
        echo "=================================="
        
        if [ "${{ needs.deploy-backend.result }}" == "success" ]; then
          echo "✅ Backend: Deployed successfully"
          echo "   🔧 API: ${{ needs.deploy-backend.outputs.backend_url }}"
          echo "   💾 Storage: ${{ needs.deploy-backend.outputs.storage_url }}"
        else
          echo "❌ Backend: Deployment failed"
        fi
        
        if [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
          echo "✅ Frontend: Deployed successfully"
          echo "   🌐 App: ${{ needs.deploy-frontend.outputs.frontend_url }}"
          echo "   🔗 Domain: https://pre.nexusdocs360.app"
        else
          echo "❌ Frontend: Deployment failed"
        fi
        
        echo ""
        echo "🎯 Environment: PRE"
        echo "📅 Deployed: $(date)"
        echo "🔄 Commit: ${{ github.sha }}"