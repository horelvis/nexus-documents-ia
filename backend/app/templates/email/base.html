<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{% block title %}NouxCubeIA{% endblock %}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background-color: #F3F4F6;
            margin: 0;
            padding: 0;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }
        .email-wrapper {
            width: 100%;
            background-color: #F3F4F6;
            padding: 32px 16px;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #7C3AED 0%, #8B5CF6 40%, #A78BFA 100%);
            padding: 32px 32px 28px;
            text-align: center;
        }
        .header-logo {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header-logo .cube {
            color: #E9D5FF;
        }
        .header-divider {
            width: 48px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.3);
            margin: 12px auto;
            border: none;
        }
        .header-tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* Content */
        .content {
            padding: 40px 32px;
        }

        /* Button */
        .button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #7C3AED 0%, #8B5CF6 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
            transition: opacity 0.2s;
            letter-spacing: 0.2px;
        }
        .button:hover {
            opacity: 0.92;
        }

        /* Footer */
        .footer {
            background-color: #F9FAFB;
            padding: 28px 32px;
            text-align: center;
            border-top: 1px solid #E5E7EB;
        }
        .footer-brand {
            font-weight: 700;
            color: #7C3AED;
        }
        .footer p {
            margin: 0;
            font-size: 13px;
            color: #6B7280;
            line-height: 1.6;
        }
        .footer a {
            color: #7C3AED;
            text-decoration: none;
        }
        .footer-note {
            font-size: 11px !important;
            color: #9CA3AF !important;
            margin-top: 12px !important;
        }
        .footer-links {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #E5E7EB;
        }
        .footer-links a {
            font-size: 12px;
            color: #9CA3AF;
            text-decoration: none;
            margin: 0 8px;
        }

        /* Responsive */
        @media only screen and (max-width: 640px) {
            .email-wrapper { padding: 16px 8px !important; }
            .email-container { border-radius: 12px !important; }
            .header { padding: 24px 20px 22px !important; }
            .header-logo { font-size: 22px !important; }
            .content { padding: 28px 20px !important; }
            .footer { padding: 20px 16px !important; }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr>
                <td align="center">
                    <div class="email-container">
                        <!-- Header -->
                        <div class="header">
                            <h1 class="header-logo">Noux<span class="cube">Cube</span>IA</h1>
                            <hr class="header-divider">
                            <p class="header-tagline">Gesti&oacute;n Documental Inteligente</p>
                        </div>

                        <!-- Content -->
                        <div class="content">
                            {% block content %}{% endblock %}
                        </div>

                        <!-- Footer -->
                        <div class="footer">
                            <p>&copy; {{ current_year }} <span class="footer-brand">NouxCubeIA</span>. Todos los derechos reservados.</p>
                            <p class="footer-note">Este es un mensaje autom&aacute;tico generado por NouxCubeIA. Por favor, no responda a este correo.</p>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
