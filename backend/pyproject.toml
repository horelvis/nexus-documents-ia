# Configuración de pytest y cobertura en pyproject.toml
# Archivo: backend/pyproject.toml

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
dynamic = ["version"]
description = "Backend API for document management system"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.5.0",
    "qdrant-client>=1.5.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "google-cloud-storage>=2.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
    "coverage[toml]>=7.2.0",
]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
# Configuración de pytest
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=app",
    "--cov-config=.coveragerc", 
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:coverage_report",
    "--cov-report=xml:coverage.xml",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=70",
    "--durations=10",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "service: marks tests as service tests",
    "database: marks tests as database tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Variables de entorno para tests
env = [
    "TESTING = true",
    "DATABASE_URL = postgresql://test_user:test_password@test-db:5432/test_db",
    "REDIS_URL = redis://test-redis:6379/0",
    "QDRANT_URL = http://test-qdrant:6333",
]

[tool.coverage.run]
# Directorio fuente
source = ["app"]
branch = true
parallel = true

# Archivos a omitir
omit = [
    # Sistema y dependencias
    "*/venv/*",
    "*/env/*", 
    "*/.venv/*",
    "*/site-packages/*",
    "*/dist-packages/*",
    
    # Tests
    "*/tests/*",
    "*/test_*",
    "*test*.py",
    "conftest.py",
    
    # Configuración
    "*/migrations/*",
    "*/settings/*",
    "*/config/*",
    "setup.py",
    "manage.py",
    
    # Auto-generados
    "*/__pycache__/*",
    "*.pyc",
    
    # Archivos específicos
    "app/main.py",
    "app/core/config.py",
    "app/core/logging.py", 
    "app/db/base_class.py",
    "app/db/__init__.py",
    "app/api/__init__.py",
    "app/api/deps.py",
]

[tool.coverage.report]
# Configuración del reporte
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Cover"

# Mismas exclusiones que en run
omit = [
    "*/venv/*",
    "*/env/*", 
    "*/.venv/*",
    "*/site-packages/*",
    "*/dist-packages/*",
    "*/tests/*",
    "*/test_*",
    "*test*.py",
    "conftest.py",
    "*/migrations/*",
    "*/settings/*",
    "*/config/*",
    "setup.py",
    "manage.py",
    "*/__pycache__/*",
    "*.pyc",
    "app/main.py",
    "app/core/config.py",
    "app/core/logging.py", 
    "app/db/base_class.py",
    "app/db/__init__.py",
    "app/api/__init__.py",
    "app/api/deps.py",
]

# Excluir líneas específicas
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__", 
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if 0:",
    "if False:",
    "raise AssertionError",
    "raise NotImplementedError",
    "raise RuntimeError",
    "except ImportError:",
    "logger.debug",
    "if DEBUG:",
    "if debug:",
]

[tool.coverage.html]
directory = "coverage_report"
title = "Backend API Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directorios a excluir
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "migrations/",
    "tests/",
    "venv/",
    "env/",
]