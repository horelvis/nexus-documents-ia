version: '3.8'

services:
  # Servicio principal de la API - DEVELOPMENT MODE con volúmenes
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      cag-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      langextract-service:
        condition: service_healthy
      elasticsearch-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      # Unified API Key for all microservices
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Services URLs
      - STORAGE_SERVICE_URL=http://storage-service:8003
      - CAG_SERVICE_URL=http://cag-service:8008
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8007
      - LANGEXTRACT_SERVICE_URL=http://langextract-service:8009
      - ELASTICSEARCH_SERVICE_URL=http://elasticsearch-service:8005
      - TEMPORALIO_SERVICE_URL=http://temporalio-service:8010
      - TEMPLATE_EDITOR_SERVICE_URL=http://template-editor-service:8011
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - GOTENBERG_BASE_URL=http://gotenberg:3000
      # Infrastructure
      - REDIS_HOST=redis
      - WEAVIATE_URL=http://weaviate:8080
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Migration settings
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}
      # Development settings
      - DEBUG=true
      - RELOAD=true
    volumes:
      # Montar código fuente para desarrollo con live reload
      - ../app:/app/app:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../migrations:/app/migrations:ro
      - ../tests:/app/tests:ro
      # Montar credentials para desarrollo
      - ../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch Service - DEVELOPMENT MODE
  elasticsearch-service:
    build:
      context: ../microservices/elasticsearch-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8005:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/elasticsearch-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CAG Service - DEVELOPMENT MODE
  cag-service:
    build:
      context: ../microservices/cag-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8008:8000"
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://genai-ollama:11434
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/cag-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Storage Service - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8003:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/storage-service/app:/app/app:ro
      # Montar credentials para GCS
      - ../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LangExtract Service - DEVELOPMENT MODE
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8009:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/langextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Weaviate Service - DEVELOPMENT MODE
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8007:8000"
    depends_on:
      weaviate:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/weaviate-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TemporalIO Service - DEVELOPMENT MODE
  temporalio-service:
    build:
      context: ../microservices/temporalio-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8010:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/temporalio-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Template Editor Service - DEVELOPMENT MODE
  template-editor-service:
    build:
      context: ../microservices/template-editor-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8011:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/template-editor-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-ollama-models.sh:/docker-entrypoint-initdb.d/init-ollama-models.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    ports:
      - "0.0.0.0:6379:6379"
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Weaviate para embeddings vectoriales
  weaviate:
    image: semitechnologies/weaviate:1.24.0
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - backend-network
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch para búsqueda híbrida
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "0.0.0.0:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - backend-network
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Qdrant para vectores (alternativo a Weaviate)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "0.0.0.0:6333:6333"
    networks:
      - backend-network
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama para modelos de lenguaje local
  genai-ollama:
    image: ollama/ollama:latest
    ports:
      - "0.0.0.0:11434:11434"
    networks:
      - backend-network
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Gotenberg para conversión de documentos
  gotenberg:
    image: gotenberg/gotenberg:8.7.0
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - backend-network
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--chromium-disable-web-security=true"
      - "--chromium-allow-file-access-from-files=true"
      - "--chromium-disable-dev-shm-usage=true"
      - "--log-level=info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  elasticsearch_data:
  qdrant_data:
  ollama_data: