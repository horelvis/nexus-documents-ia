services:
  # Servicio principal de la API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - qdrant
      - langchain-service
      - langroid-service
      - ollama-service
      - storage-service
    networks:
      - backend-network
    env_file:
      - ../.env
    environment:
      # Services URLs
      - STORAGE_SERVICE_URL=http://storage-service:8001
      - STORAGE_API_KEY=dev-storage-api-key-12345
      - LANGCHAIN_SERVICE_URL=http://langchain-service:8001
      - LANGROID_SERVICE_URL=http://langroid-service:8002
      - OLLAMA_BASE_URL=http://ollama-service:11434
      # Infrastructure
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      # General
      - DEBUG=${DEBUG:-true}
      - TESTING=${TESTING:-false}
    volumes:
      - ../:/app  # Monta toda la carpeta backend en /app
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  # Qdrant para vectores
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LangChain microservice - DEVELOPMENT MODE
  langchain-service:
    build:
      context: ../microservices/langchain-service
      dockerfile: Dockerfile.dev  # Using development Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
      - ollama-service
    networks:
      - backend-network
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama-service:11434
      - OLLAMA_MODEL=llama3.1:8b
      - EMBEDDING_MODEL=nomic-embed-text
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/langchain-service/app:/app/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Langroid microservice - DEVELOPMENT MODE
  langroid-service:
    build:
      context: ../microservices/langroid-service
      dockerfile: Dockerfile.dev  # Using development Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      - qdrant
      - ollama-service
    networks:
      - backend-network
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama-service:11434
      - DEFAULT_LLM_MODEL=llama3.1:8b
      - DEFAULT_EMBEDDING_MODEL=nomic-embed-text
      - SECRET_KEY=${SECRET_KEY:-langroid-secret-key}
      - LOG_LEVEL=INFO
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/langroid-service/app:/app/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ollama Microservice - DEVELOPMENT MODE
  ollama-service:
    build:
      context: ../microservices/ollama-service
      dockerfile: Dockerfile.dev  # Using development Dockerfile
    ports:
      - "11434:11434"  # Ollama server port
      - "8004:8000"    # FastAPI wrapper port
    volumes:
      - ollama_data:/root/.ollama
      # Mount the Python code for live reloading
      - ../microservices/ollama-service/app:/app/app:rw
    networks:
      - backend-network
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
      - PYTHONPATH=/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Storage Microservice - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile.dev  # Using development Dockerfile
    ports:
      - "8003:8001"
    networks:
      - backend-network
    volumes:
      - ../credentials:/app/credentials:ro
      # Mount the Python code for live reloading
      - ../microservices/storage-service/app:/app/app:rw
    env_file:
      - ../.env
    environment:
      - API_KEY=dev-storage-api-key-12345
      - GCS_PROJECT_ID=nexus-document-ia
      - GCS_CREDENTIALS=/app/credentials/nexus-document-ia-04252dae0146.json
      - GCS_BUCKET_NAME=nexus-docs-eu
      - SIGNED_URL_EXPIRATION=3600
      - MAX_UPLOAD_SIZE=104857600
      - RATE_LIMIT_PER_MINUTE=10
      - DEBUG=true
      - TESTING=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data: