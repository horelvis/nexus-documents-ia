# Docker Compose for On-Premise deployment
# Minimal services required for RAG functionality with Emma AI
#
# Usage:
#   docker compose -f docker-compose.onpremise.yml up -d
#
# Services:
#   - db: PostgreSQL (relational data, Langfuse)
#   - redis: Cache and session storage
#   - weaviate: Vector database for embeddings
#   - weaviate-service: RAG pipeline (vector search and retrieval)
#   - emma-agent-service: AI agent orchestration (Emma v2 + LangGraph)
#   - sglang: SGLang GPU inference — Chat (Qwen3.5-9B) + Planner (Qwen3.5-4B)
#   - background-worker: Async task processing (Celery) for verification
#   - api: Main backend API (optional, for UI integration)

services:
  # =============================================================================
  # PostgreSQL - Relational Data
  # =============================================================================
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: nouxcube/postgres:pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Redis - Cache and Session Storage
  # =============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Weaviate - Vector Database
  # =============================================================================
  weaviate:
    image: semitechnologies/weaviate:1.28.3
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - backend-network
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # SGLang — Dual-Model Architecture (Qwen3.5)
  # =============================================================================
  # Two SGLang instances sharing one GPU (RTX 4090 24GB):
  #
  #   Modelo          VRAM (AWQ INT4)    Funcion
  #   ─────────────   ──────────────     ──────────────────────────
  #   Qwen3.5-9B      ~8-10 GB           Chat, reasoning, synthesis
  #   Qwen3.5-4B      ~3-4  GB           Planner, tool routing, clues
  #   BGE-M3          ~2.7  GB           Embeddings (intelligence-docs-service)
  #   ─────────────   ──────────────
  #   Total           ~14-17 GB          Leaves ~7-10 GB for KV cache
  #
  # Single-model mode (SGLANG_DUAL_MODEL=false):
  #   Only 'sglang' service runs. Both PLANNER and CHAT roles use same model.
  #   mem-fraction-static: 0.80 (full GPU minus embedding headroom).
  #
  # Dual-model mode (SGLANG_DUAL_MODEL=true):
  #   Both 'sglang' + 'sglang-planner' run. GPU partitioned via mem-fraction-static.
  #   Enable with: docker compose --profile dual-model up -d
  #   mem-fraction: 0.55 (chat) + 0.18 (planner) = 0.73 total.
  # =============================================================================

  # ── Chat Model (Qwen3.5-9B) — Quality generation, final responses ──
  sglang:
    image: lmsysorg/sglang:v0.5.9
    ports:
      - "8001:8000"
    networks:
      - backend-network
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    command: >
      python -m sglang.launch_server
      --model-path ${SGLANG_MODEL:-Qwen/Qwen3.5-9B}
      --served-model-name ${SGLANG_MODEL:-Qwen/Qwen3.5-9B}
      --port 8000
      --host 0.0.0.0
      --context-length ${SGLANG_MAX_MODEL_LEN:-16384}
      --mem-fraction-static ${SGLANG_GPU_UTIL:-0.65}
      --quantization fp8
      --trust-remote-code
      --tool-call-parser ${SGLANG_TOOL_PARSER:-qwen3_coder}
      --reasoning-parser qwen3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # ── Planner Model (Qwen3.5-4B) — Fast tool calling, routing, clue generation ──
  # Only used when SGLANG_DUAL_MODEL=true. Enable with: --profile dual-model
  # Shares the GPU with sglang via mem-fraction-static partitioning.
  sglang-planner:
    image: lmsysorg/sglang:v0.5.9
    ports:
      - "8003:8000"
    networks:
      - backend-network
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    command: >
      python -m sglang.launch_server
      --model-path ${SGLANG_PLANNER_MODEL:-Qwen/Qwen3.5-4B}
      --served-model-name ${SGLANG_PLANNER_MODEL:-Qwen/Qwen3.5-4B}
      --port 8000
      --host 0.0.0.0
      --context-length ${SGLANG_PLANNER_MAX_MODEL_LEN:-8192}
      --mem-fraction-static ${SGLANG_PLANNER_GPU_UTIL:-0.18}
      --quantization fp8
      --trust-remote-code
      --tool-call-parser ${SGLANG_PLANNER_TOOL_PARSER:-qwen3_coder}
      --reasoning-parser qwen3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    profiles:
      - dual-model


  # =============================================================================
  # Apache Tika - Document Text Extraction
  # =============================================================================
  tika:
    image: apache/tika:3.1.0.0
    environment:
      - JAVA_OPTS=-Xms1g -Xmx8g
    deploy:
      resources:
        limits:
          memory: 10g
    networks:
      - backend-network
    restart: unless-stopped

  # =============================================================================
  # Gotenberg - Document Conversion (DOCX/XLSX/PPTX → PDF)
  # =============================================================================
  # LibreOffice-based converter for document preview. Used by /converted-pdf endpoint.
  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - backend-network
    restart: unless-stopped

  # =============================================================================
  # GLM-OCR — VLM-based OCR for scanned documents and images (0.9B params)
  # =============================================================================
  # State-of-the-art document understanding: OCR, tables, formulas, seals.
  # Served via SGLang dev (needs latest transformers for glm_ocr architecture).
  # Concurrent requests supported via RadixAttention. ~2 GB VRAM.
  glm-ocr:
    build:
      context: .
      dockerfile: Dockerfile.glm-ocr
    networks:
      - backend-network
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    command: >
      python -m sglang.launch_server
      --model-path ${GLM_OCR_MODEL:-zai-org/GLM-OCR}
      --served-model-name ${GLM_OCR_MODEL:-zai-org/GLM-OCR}
      --port 8000
      --host 0.0.0.0
      --mem-fraction-static 0.08
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # =============================================================================
  # Intelligence Docs Service — Unified extraction + embedding + NER
  # =============================================================================
  # Replaces textextract-service + langextract-service + embedding code in weaviate-service.
  # Provider registry with automatic fallback. On-premise first, cloud opt-in.
  intelligence-docs-service:
    build:
      context: ../microservices/intelligence-docs-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - EXTRACTION_PROVIDERS=${EXTRACTION_PROVIDERS:-docling,glm-ocr}
      - EMBEDDING_PROVIDERS=${EMBEDDING_PROVIDERS:-sentence-transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
      - ENTITY_PROVIDERS=${ENTITY_PROVIDERS:-regex}
      - DOCLING_URL=http://docling:5001
      - TIKA_URL=http://tika:9998
      - GLM_OCR_URL=${GLM_OCR_URL:-http://glm-ocr:8000/v1}
      - GLM_OCR_MODEL=${GLM_OCR_MODEL:-zai-org/GLM-OCR}
      - SGLANG_BASE_URL=http://sglang:8000/v1
      - SGLANG_MODEL=${SGLANG_MODEL:-}
    networks:
      - backend-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # =============================================================================
  # Docling - AI Document Understanding (opt-in via --profile docling)
  # =============================================================================
  # IBM Docling extracts structured Markdown from documents, preserving
  # headers, tables, lists, and reading order with 97.9% table accuracy.
  # CPU-only image (GPU reserved for vLLM). ~4.4GB image, ~8GB RAM.
  # Start with: docker compose --profile docling up -d
  # Then set EXTRACTION_BACKEND=docling in .env and restart textextract-service
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    environment:
      - DOCLING_SERVE_ENABLE_UI=false
      - DOCLING_SERVE_MAX_SYNC_WAIT=300
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=2
      - OMP_NUM_THREADS=4
    deploy:
      resources:
        limits:
          memory: 8g
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    profiles:
      - docling

  # =============================================================================
  # TextExtract Service - Text Extraction API
  # =============================================================================
  textextract-service:
    build:
      context: ../microservices/textextract-service
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 10g
    depends_on:
      - tika
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - TIKA_URL=http://tika:9998
      # Extraction backend: "tika" (default) or "docling" (AI document understanding)
      # Docling requires: docker compose --profile docling up -d
      - EXTRACTION_BACKEND=${EXTRACTION_BACKEND:-tika}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      - EXTRACTION_FALLBACK_ENABLED=${EXTRACTION_FALLBACK_ENABLED:-true}
    volumes:
      - ../microservices/textextract-service/app:/app/app:ro
      - easyocr_models:/root/.EasyOCR
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # LangExtract Service - Entity Extraction (LLM-powered NER)
  # =============================================================================
  # Extracts named entities from documents during indexing:
  #   - PERSON, ORGANIZATION, DATE, AMOUNT, LOCATION (via LLM)
  #   - DNI, NIE, CIF (via regex, always local)
  # Used by weaviate-service indexing pipeline to populate Knowledge Graph.
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    depends_on:
      sglang:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Override LLM provider to use local SGLang (reuses Qwen3.5-9B already in the stack)
      - LLM_PROVIDER=sglang
      - LLM_MODEL=${SGLANG_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      - LLM_API_BASE=http://sglang:8000/v1
    volumes:
      - ../microservices/langextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Weaviate Service - RAG Pipeline
  # =============================================================================
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    # Port exposed via tls-proxy (nginx) on host :8007
    depends_on:
      weaviate:
        condition: service_healthy
      sglang:
        condition: service_healthy
      db:
        condition: service_healthy
      textextract-service:
        condition: service_started
      langextract-service:
        condition: service_healthy
      intelligence-docs-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - TEXT_EXTRACTION_SERVICE_URL=http://textextract-service:8000
      - LANGEXTRACT_SERVICE_URL=http://langextract-service:8000
      - INTELLIGENCE_DOCS_SERVICE_URL=http://intelligence-docs-service:8000
      - STORAGE_SERVICE_URL=http://storage-service:8010
      # OCR: disabled during bulk indexing (Tika handles text extraction)
      - ENHANCED_OCR_ENABLED=false
      # SGLang Configuration
      - SGLANG_ENABLED=${SGLANG_ENABLED:-true}
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang:8000/v1}
      - SGLANG_MODEL=${SGLANG_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      - SGLANG_ENABLE_THINKING=${SGLANG_ENABLE_THINKING:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-sglang}
      # Embedding: delegated to intelligence-docs-service (no local GPU model)
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - MULTIMODAL_EMBEDDING_ENABLED=${MULTIMODAL_EMBEDDING_ENABLED:-false}
      # Parent-Child Chunking (search small, retrieve large)
      - PARENT_CHILD_CHUNKING_ENABLED=${PARENT_CHILD_CHUNKING_ENABLED:-false}
      # Per-Chunk LLM Context Enrichment (Anthropic full pattern)
      - CONTEXTUAL_RETRIEVAL_USE_LLM=${CONTEXTUAL_RETRIEVAL_USE_LLM:-false}
      # Agent settings
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - DEFAULT_WORKFLOW=${DEFAULT_WORKFLOW:-auto}
      - AGENT_FRAMEWORK=${AGENT_FRAMEWORK:-qwen-agent}
      # Knowledge Tree Service
      - KNOWLEDGE_TREE_SERVICE_URL=http://knowledge-tree-service:8011
      # Emma Agent Service (for memory generation at indexing time)
      - EMMA_AGENT_SERVICE_URL=http://emma-agent-service:8009
      - MEMORY_BANK_ENABLED=${MEMORY_BANK_ENABLED:-true}
      # Suppress warnings
      - PYTHONWARNINGS=ignore::DeprecationWarning:httpx._models,ignore::DeprecationWarning:spacy.cli._util,ignore::DeprecationWarning:pydantic
    volumes:
      - ../microservices/weaviate-service/app:/app/app:ro
      - ../microservices/weaviate-service/config:/app/config:ro
      - ../microservices/weaviate-service/scripts:/app/scripts:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # No GPU needed — embeddings delegated to intelligence-docs-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # FalkorDB - Graph Database (OpenCypher, Redis-based)
  # =============================================================================
  # Replaces Apache AGE for knowledge graph operations. Redis-compatible
  # protocol with native OpenCypher support and sub-millisecond queries.
  falkordb:
    image: falkordb/falkordb:v4.2.0
    command: >
      redis-server
      --appendonly yes
      --save "60 1"
      --save "300 100"
      --loadmodule /FalkorDB/bin/src/falkordb.so
    ports:
      - "6380:6379"   # Redis-compatible protocol (offset to avoid clash with Redis)
      - "3003:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Knowledge Tree Service - Structural Context (FalkorDB)
  # =============================================================================
  knowledge-tree-service:
    build:
      context: ../microservices/knowledge-tree-service
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    depends_on:
      db:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - RAG_KNOWLEDGE_GRAPH_ENABLED=${RAG_KNOWLEDGE_GRAPH_ENABLED:-true}
      - ACTIVE_SECTOR=${ACTIVE_SECTOR:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # FalkorDB Configuration
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_GRAPH_NAME=${FALKORDB_GRAPH_NAME:-knowledge_graph}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
    volumes:
      - ../microservices/knowledge-tree-service/app:/app/app:ro
      - ../microservices/knowledge-tree-service/config:/app/config:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8011", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Emma Agent Service - AI Agent Orchestration
  # =============================================================================
  # Provides:
  #   - Emma v2 agent with LLM-based reasoning (replaces SLM Router)
  #   - LangGraph multi-agent orchestration
  #   - Session and conversation management
  #   - Domain-specific specialists (legal, fiscal, privacy, etc.)
  # =============================================================================
  emma-agent-service:
    build:
      context: ../microservices/emma-agent-service
      dockerfile: Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-988}
    # TLS access via tls-proxy (nginx) on host :8009
    # Localhost-only HTTP for Next.js dev proxy (not exposed to network)
    ports:
      - "127.0.0.1:8019:8009"
    depends_on:
      weaviate-service:
        condition: service_healthy
      knowledge-tree-service:
        condition: service_healthy
      sglang:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      langfuse:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Weaviate Service connection (for RAG)
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8000
      - WEAVIATE_SERVICE_TIMEOUT=120
      # Knowledge Tree Service (structural context)
      - KNOWLEDGE_TREE_SERVICE_URL=${KNOWLEDGE_TREE_SERVICE_URL:-http://knowledge-tree-service:8011}
      - KNOWLEDGE_TREE_SERVICE_TIMEOUT=30
      # Multi-Pipeline RAG Sector
      - ACTIVE_SECTOR=${ACTIVE_SECTOR:-}
      # SGLang Configuration — Dual-Model Architecture
      # Set SGLANG_DUAL_MODEL=true + docker compose --profile dual-model to enable
      - SGLANG_ENABLED=${SGLANG_ENABLED:-true}
      - SGLANG_DUAL_MODEL=${SGLANG_DUAL_MODEL:-false}
      # Chat model (9B quality generation)
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang:8000/v1}
      - SGLANG_MODEL=${SGLANG_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      - SGLANG_ENABLE_THINKING=${SGLANG_ENABLE_THINKING:-false}
      # Planner model (4B fast tool calling) — only active when SGLANG_DUAL_MODEL=true
      - SGLANG_PLANNER_URL=${SGLANG_PLANNER_URL:-http://sglang-planner:8000/v1}
      - SGLANG_PLANNER_MODEL=${SGLANG_PLANNER_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}
      - LLM_PROVIDER=${LLM_PROVIDER:-sglang}
      # Redis for sessions
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Database for persistence
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      # Agent settings
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - DEFAULT_WORKFLOW=${DEFAULT_WORKFLOW:-auto}
      - AGENT_MAX_TURNS=15
      - AGENT_TIMEOUT_SECONDS=300
      # Single-tenant mode for on-premise
      - SINGLE_TENANT_MODE=true
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      # Langfuse - Prompt Management & LLM Observability
      - LANGFUSE_ENABLED=true
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-emma-dev}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-emma-dev}
      - USE_LANGFUSE_PROMPTS=${USE_LANGFUSE_PROMPTS:-true}
      # Background Worker (for Celery verification tasks)
      - BACKGROUND_WORKER_URL=http://background-worker:8100
      # Document Forge Service (template-based document generation)
      - DOCUMENT_FORGE_SERVICE_URL=${DOCUMENT_FORGE_SERVICE_URL:-http://document-forge-service:8013}
      - DOCUMENT_FORGE_ENABLED=${DOCUMENT_FORGE_ENABLED:-true}
      # Upload limit — hard gate (rejects files exceeding this, does NOT truncate)
      - EMMA_UPLOAD_MAX_CHARS_PER_DOC=${EMMA_UPLOAD_MAX_CHARS_PER_DOC:-2000000}
      # Default Location for Social Channels
      - DEFAULT_LOCATION_CITY=${DEFAULT_LOCATION_CITY:-Molina de Segura}
      - DEFAULT_LOCATION_REGION=${DEFAULT_LOCATION_REGION:-Región de Murcia}
      - DEFAULT_LOCATION_COUNTRY=${DEFAULT_LOCATION_COUNTRY:-España}
      - DEFAULT_LOCATION_TIMEZONE=${DEFAULT_LOCATION_TIMEZONE:-Europe/Madrid}
      # RAG Quality Features (Phase 1 — no re-indexation needed)
      - SMART_SEARCH_CROSS_ENCODER_ENABLED=${SMART_SEARCH_CROSS_ENCODER_ENABLED:-true}
      - REACT_QUALITY_GATE_ENABLED=${REACT_QUALITY_GATE_ENABLED:-true}
      - REACT_CONTEXT_COMPRESS_ENABLED=${REACT_CONTEXT_COMPRESS_ENABLED:-true}
      - REACT_QUERY_CLARIFICATION_ENABLED=${REACT_QUERY_CLARIFICATION_ENABLED:-false}
      # RLM (Recursive Language Models) Configuration
      - RLM_ENABLED=${RLM_ENABLED:-false}
      - RLM_TOKEN_THRESHOLD=${RLM_TOKEN_THRESHOLD:-16000}
      - RLM_CHUNK_SIZE=${RLM_CHUNK_SIZE:-6000}
      - RLM_CHUNK_OVERLAP=${RLM_CHUNK_OVERLAP:-500}
      - RLM_MAX_DEPTH=${RLM_MAX_DEPTH:-3}
      - RLM_MAX_CHUNKS=${RLM_MAX_CHUNKS:-20}
      # Web Search (Tavily primary, DuckDuckGo fallback)
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-5}
      - WEB_SEARCH_REGION=${WEB_SEARCH_REGION:-es-es}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Document Generation & Email Tools
      - DOCUMENT_GENERATION_ENABLED=${DOCUMENT_GENERATION_ENABLED:-true}
      - EMAIL_TOOL_ENABLED=${EMAIL_TOOL_ENABLED:-true}
      # Swarm Agent (parallel sub-agent execution)
      - SWARM_ENABLED=${SWARM_ENABLED:-false}
      - SWARM_MAX_WORKERS=${SWARM_MAX_WORKERS:-5}
      - SWARM_WORKER_MAX_STEPS=${SWARM_WORKER_MAX_STEPS:-2}
      - SWARM_WORKER_TIMEOUT_SECONDS=${SWARM_WORKER_TIMEOUT_SECONDS:-45}
      - SWARM_COMPLEXITY_THRESHOLD=${SWARM_COMPLEXITY_THRESHOLD:-3}
      # LangGraph Checkpointer (PostgresSaver) — Level 3 persistence
      - LANGGRAPH_CHECKPOINTER_ENABLED=${LANGGRAPH_CHECKPOINTER_ENABLED:-true}
      # Suppress warnings
      - PYTHONWARNINGS=ignore::DeprecationWarning:httpx._models,ignore::DeprecationWarning:pydantic
    volumes:
      - ../microservices/emma-agent-service/app:/app/app:ro
      - ../microservices/emma-agent-service/config:/app/config:ro
      - ../microservices/emma-agent-service/scripts:/app/scripts:ro
      - huggingface_cache:/root/.cache/huggingface
      - fastembed_cache:/tmp/fastembed_cache
      # Docker socket for ephemeral CENDOJ agent containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8009", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # Document Forge Service - Template-based document generation
  # =============================================================================
  # Preserves original DOCX formatting while modifying detected variable fields.
  # Uses LLM for field detection + docxtpl for Jinja2 rendering.
  document-forge-service:
    build:
      context: ../microservices/document-forge-service
      dockerfile: Dockerfile
    container_name: document-forge-service
    ports:
      - "127.0.0.1:8013:8013"
    env_file:
      - .env
    environment:
      - SERVICE_PORT=8013
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang:8000/v1}
      - SGLANG_MODEL_NAME=${SGLANG_MODEL:-Qwen/Qwen3.5-9B}
      - GOTENBERG_SERVICE_URL=${GOTENBERG_SERVICE_URL:-http://gotenberg-service:8005}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - MAIN_API_URL=${MAIN_API_URL:-http://main-api:8000}
      - FORGE_SESSION_TTL=${FORGE_SESSION_TTL:-1800}
      - DOCUMENT_FORGE_ENABLED=${DOCUMENT_FORGE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../microservices/document-forge-service/app:/app/app:ro
      - ../microservices/document-forge-service/config:/app/config:ro
    networks:
      - backend-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8013", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # =============================================================================
  # Background Worker - Async task processing (Celery)
  # =============================================================================
  # Handles: claim verification, preview generation, indexing retries
  background-worker:
    build:
      context: ..
      dockerfile: microservices/background-worker/Dockerfile
    command: ["/app/backend/microservices/background-worker/start.sh"]
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - KNOWLEDGE_TREE_SERVICE_URL=${KNOWLEDGE_TREE_SERVICE_URL:-http://knowledge-tree-service:8011}
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang:8000/v1}
      - SGLANG_MODEL=${SGLANG_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      # Dual-model architecture
      - SGLANG_DUAL_MODEL=${SGLANG_DUAL_MODEL:-false}
      - SGLANG_PLANNER_URL=${SGLANG_PLANNER_URL:-http://sglang-planner:8000/v1}
      - SGLANG_PLANNER_MODEL=${SGLANG_PLANNER_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Web Search (DuckDuckGo)
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-3}
      - WEB_SEARCH_REGION=${WEB_SEARCH_REGION:-es-es}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      knowledge-tree-service:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ../:/app/backend
      - ../../credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Emma Reactive Worker - Event listener for reactive AI
  # =============================================================================
  # Listens to Redis Streams events and dispatches triggers/actions
  emma-reactive-worker:
    build:
      context: ../microservices/emma-agent-service
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      emma-agent-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVENT_CONSUMER_GROUP=emma_reactive
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8000
      - SGLANG_ENABLED=${SGLANG_ENABLED:-true}
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang:8000/v1}
      - SGLANG_MODEL=${SGLANG_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      # Dual-model architecture
      - SGLANG_DUAL_MODEL=${SGLANG_DUAL_MODEL:-false}
      - SGLANG_PLANNER_URL=${SGLANG_PLANNER_URL:-http://sglang-planner:8000/v1}
      - SGLANG_PLANNER_MODEL=${SGLANG_PLANNER_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}
      - LLM_PROVIDER=${LLM_PROVIDER:-sglang}
      - SINGLE_TENANT_MODE=true
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - ACTIVE_SECTOR=${ACTIVE_SECTOR:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
    volumes:
      - ../microservices/emma-agent-service/app:/app/app:ro
      - ../microservices/emma-agent-service/config:/app/config:ro
    command: ["python", "-m", "app.workers.event_listener"]
    restart: unless-stopped

  # =============================================================================
  # ngrok - Tunnel for webhooks (Slack, Telegram, WhatsApp)
  # =============================================================================
  # Exposes emma-agent-service to the internet for channel webhook callbacks.
  # Requires NGROK_AUTHTOKEN from https://dashboard.ngrok.com/get-started/your-authtoken
  # After startup, check logs: docker compose logs ngrok | grep "url="
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "emma-agent-service:8009", "--log=stdout"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    ports:
      - "4040:4040"  # ngrok web UI (inspect requests)
    restart: unless-stopped
    profiles:
      - webhooks  # Only starts with: docker compose --profile webhooks up

  # =============================================================================
  # MCP Alfresco Server - Alfresco sync, indexing & MCP tools
  # =============================================================================
  mcp-alfresco:
    build:
      context: ../microservices/mcp-alfresco-server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - CONNECTOR_CACHE_TTL=${CONNECTOR_CACHE_TTL:-300}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      - ../microservices/mcp-alfresco-server/app:/app/app:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # MCP Google Drive Server - Google Drive sync, indexing & MCP tools
  # =============================================================================
  mcp-google-drive:
    build:
      context: ../microservices/mcp-google-drive-server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - CONNECTOR_CACHE_TTL=${CONNECTOR_CACHE_TTL:-300}
    volumes:
      - ../microservices/mcp-google-drive-server/app:/app/app:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # MCP OneDrive Server - OneDrive for Business sync, indexing & MCP tools
  # =============================================================================
  mcp-onedrive:
    build:
      context: ../microservices/mcp-onedrive-server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - MS_OAUTH_CLIENT_ID=${MS_OAUTH_CLIENT_ID}
      - MS_OAUTH_CLIENT_SECRET=${MS_OAUTH_CLIENT_SECRET}
      - MS_OAUTH_TENANT_ID=${MS_OAUTH_TENANT_ID:-common}
      - MS_OAUTH_REDIRECT_URI=${MS_OAUTH_REDIRECT_URI:-https://localhost:3001/connectors/oauth/callback}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - CONNECTOR_CACHE_TTL=${CONNECTOR_CACHE_TTL:-300}
    volumes:
      - ../microservices/mcp-onedrive-server/app:/app/app:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Main API - Backend for UI integration
  # =============================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Port 8000 exposed via tls-proxy (HTTPS, for browsers)
    # Port 8002 exposed directly (HTTP, for Next.js server-side rewrites)
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      weaviate-service:
        condition: service_healthy
      emma-agent-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      mcp-alfresco:
        condition: service_healthy
      mcp-google-drive:
        condition: service_healthy
      mcp-onedrive:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - SIGNATURE_ENCRYPTION_KEY=${SIGNATURE_ENCRYPTION_KEY}
      - ALLOW_ALL_CORS=true
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - CAG_SERVICE_URL=${CAG_SERVICE_URL:-http://weaviate-service:8000}
      # Emma Agent Service (AI chat)
      - EMMA_SERVICE_URL=${EMMA_SERVICE_URL:-http://emma-agent-service:8009}
      - STORAGE_SERVICE_URL=http://storage-service:8010
      - MCP_ALFRESCO_URL=${MCP_ALFRESCO_URL:-http://mcp-alfresco:8000}
      - MCP_GOOGLE_DRIVE_URL=${MCP_GOOGLE_DRIVE_URL:-http://mcp-google-drive:8000}
      - MCP_ONEDRIVE_URL=${MCP_ONEDRIVE_URL:-http://mcp-onedrive:8000}
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - REDIS_HOST=redis
      - WEAVIATE_URL=http://weaviate:8080
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}
      - DEPLOYMENT_MODE=on_premise
      # OIDC/KeyCloak Configuration
      - OIDC_ISSUER=${OIDC_ISSUER:-https://nouxcubeai.ddns.net:8085/realms/nouxcube}
      - OIDC_INTERNAL_ISSUER=${OIDC_INTERNAL_ISSUER:-http://keycloak:8080/realms/nouxcube}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-nouxcube-backend}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-nouxcube-backend-secret-change-in-production}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-nouxcube-frontend}
    volumes:
      - ../app:/app/app:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../core:/app/core:ro
      - ../modules:/app/modules:ro
      - ../../credentials:/app/credentials:ro
      - local_storage_data:/app/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # =============================================================================
  # Frontend On-Premise - Next.js production build
  # =============================================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: apps/on-premise/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://nouxcubeai.ddns.net:8000/api/v1}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://nouxcubeai.ddns.net:8000/api/v1}
        - NEXT_PUBLIC_API_STREAMING_URL=${NEXT_PUBLIC_API_STREAMING_URL:-https://nouxcubeai.ddns.net:8000}
        - NEXT_PUBLIC_WEAVIATE_SERVICE_URL=${NEXT_PUBLIC_WEAVIATE_SERVICE_URL:-https://nouxcubeai.ddns.net:8007}
        - NEXT_PUBLIC_EMMA_SERVICE_URL=${NEXT_PUBLIC_EMMA_SERVICE_URL:-https://nouxcubeai.ddns.net:8009}
        - NEXT_PUBLIC_SSO_AUTHORITY=${NEXT_PUBLIC_SSO_AUTHORITY:-https://nouxcubeai.ddns.net:8085/realms/nouxcube}
        - NEXT_PUBLIC_SSO_CLIENT_ID=${NEXT_PUBLIC_SSO_CLIENT_ID:-nouxcube-frontend}
        - NEXT_PUBLIC_SSO_REDIRECT_URI=${NEXT_PUBLIC_SSO_REDIRECT_URI:-https://nouxcubeai.ddns.net/auth/callback}
        - NEXT_PUBLIC_SSO_POST_LOGOUT_REDIRECT_URI=${NEXT_PUBLIC_SSO_POST_LOGOUT_REDIRECT_URI:-https://nouxcubeai.ddns.net}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://nouxcubeai.ddns.net}
        - NEXT_PUBLIC_BACKEND_URL=http://api:8000
        - NEXT_PUBLIC_LANGFUSE_URL=${NEXT_PUBLIC_LANGFUSE_URL:-https://nouxcubeai.ddns.net:3002}
    volumes:
      # Override baked routes-manifest to proxy /api/v1/* → api:8000 (not localhost:8002)
      - ./nginx/frontend-routes-manifest.json:/app/apps/on-premise/.next/routes-manifest.json:ro
    environment:
      # Server-side runtime var — overrides the baked-in NEXT_PUBLIC_BACKEND_URL
      # so Next.js rewrites() proxy to the correct Docker-internal API address.
      - BACKEND_URL=http://api:8000
    # Port 3001 exposed via tls-proxy (HTTPS for browsers)
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # =============================================================================
  # TLS Proxy - HTTPS termination for browser-accessible services
  # =============================================================================
  # Nginx reverse proxy that adds TLS in front of:
  #   - Main API        (host :8000 → api:8000)
  #   - Emma Agent      (host :8009 → emma-agent-service:8009) + WebSocket
  #   - Weaviate Service(host :8007 → weaviate-service:8000)
  # Internal Docker communication stays HTTP (no cert trust needed).
  tls-proxy:
    image: nginx:1.27-alpine
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "8007:8007"
      - "8009:8009"
      - "8085:8085"
    volumes:
      - ./nginx/tls-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls-proxy-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - ../../frontend/apps/on-premise/certificates:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      emma-agent-service:
        condition: service_healthy
      weaviate-service:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped

  # =============================================================================
  # Certbot - Let's Encrypt certificate automation (sidecar)
  # =============================================================================
  # Runs by default. Obtains/renews certs via HTTP-01 challenge (nginx port 80),
  # copies them to the shared certificates directory, and signals nginx to reload.
  # On first run with self-signed certs, certbot replaces them with LE certs.
  # If HTTP-01 fails (port 80 closed), self-signed certs remain active (graceful).
  certbot:
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "/opt/certbot/entrypoint.sh"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      # Read-write mount to deploy certs where tls-proxy and KeyCloak read them
      - ../../frontend/apps/on-premise/certificates:/certs
      # Scripts
      - ./nginx/certbot-entrypoint.sh:/opt/certbot/entrypoint.sh:ro
      - ./nginx/certbot-deploy-hook.sh:/opt/certbot/deploy-hook.sh:ro
    environment:
      - CERTBOT_DOMAIN=${CERTBOT_DOMAIN:-nouxcubeai.ddns.net}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@example.com}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
    depends_on:
      tls-proxy:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  # =============================================================================
  # KeyCloak - OAuth/OIDC Server for SSO
  # =============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # No external ports — nginx tls-proxy terminates TLS on port 8085
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Hostname: external HTTPS URL (nginx terminates TLS)
      - KC_HOSTNAME=https://nouxcubeai.ddns.net:8085
      # HTTP only — TLS handled by nginx tls-proxy
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      # Only set login theme (not admin/welcome/account which don't exist in custom theme)
      - KC_SPI_THEME_LOGIN_DEFAULT=bufete-lexnova
    volumes:
      - ./keycloak/themes/bufete-lexnova:/opt/keycloak/themes/bufete-lexnova:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - backend-network
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3;cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # MinIO - S3-Compatible Object Storage (On-Premise)
  # =============================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Storage Service - FastAPI + MinIO SDK (REST-only, replaces mcp-storage)
  # =============================================================================
  storage-service:
    build:
      context: ../microservices/storage-service
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-nexus-storage}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # NouxCube Presentation Service - PowerPoint Generation
  # =============================================================================
  presentation-service:
    build:
      context: ../microservices/presentation-service
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      sglang:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - PRESENTATION_API_KEY=${MICROSERVICES_API_KEY}
      - PRESENTATION_SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang:8000/v1}
      - PRESENTATION_SGLANG_MODEL=${SGLANG_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      - PRESENTATION_STORAGE_SERVICE_URL=http://storage-service:8010
      - PRESENTATION_MAIN_API_URL=${MAIN_API_URL:-http://api:8000}
      - PRESENTATION_PUBLIC_API_URL=${PUBLIC_API_URL:-https://nouxcubeai.ddns.net:8000}
      - PRESENTATION_LOCAL_STORAGE_PATH=/app/storage
      - DEFAULT_LANGUAGE=${PRESENTATION_DEFAULT_LANGUAGE:-es-ES}
      - DEFAULT_TEMPLATE=${PRESENTATION_DEFAULT_TEMPLATE:-corporate}
      - DEFAULT_MAX_SLIDES=${PRESENTATION_DEFAULT_MAX_SLIDES:-10}
    volumes:
      - ../microservices/presentation-service/app:/app/app:ro
      - ../microservices/presentation-service/templates:/app/templates:ro
      - local_storage_data:/app/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/ping').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # Langfuse - LLM Observability & Prompt Management
  # =============================================================================
  # Core component for:
  # - Prompt versioning and management (Web UI)
  # - A/B testing for prompts
  # - LLM tracing and observability
  # - Rollback capabilities
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3002:3000"  # Host 3002 (3000-3001 used by Next.js)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    environment:
      # Database (uses separate database to avoid schema conflicts)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@db:5432/langfuse
      # Auth
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme-langfuse-secret-key-32chars}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://nouxcubeai.ddns.net:3002}
      - SALT=${LANGFUSE_SALT:-changeme-langfuse-salt-key}
      # Telemetry (optional, can disable)
      - TELEMETRY_ENABLED=false
      # Sign-up: set to true after creating admin user
      - AUTH_DISABLE_SIGNUP=${LANGFUSE_DISABLE_SIGNUP:-false}
      # Init admin user (for first run)
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-langfuse-admin-password}
      # Project/Org init
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-NouxCubeIA}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-Emma}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-emma-dev}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-emma-dev}
    healthcheck:
      test: ["CMD-SHELL", "IP=$$(hostname -i) && node -e \"require('http').get('http://'+'$$IP'+':3000/api/public/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  vllm_cache:  # kept as-is to preserve existing cached models
  huggingface_cache:
  fastembed_cache:
  ollama_data:
  keycloak_data:
  local_storage_data:
  minio_data:
  easyocr_models:
  falkordb_data:
  certbot_conf:
  certbot_webroot:
