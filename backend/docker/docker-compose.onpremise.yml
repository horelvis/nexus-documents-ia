# Docker Compose for On-Premise deployment
# Minimal services required for RAG functionality with Emma AI
#
# Usage:
#   docker compose -f docker-compose.onpremise.yml up -d
#
# Services:
#   - db: PostgreSQL with Apache AGE for knowledge graph
#   - redis: Cache and session storage
#   - weaviate: Vector database for embeddings
#   - weaviate-service: RAG pipeline (vector search and retrieval)
#   - emma-agent-service: AI agent orchestration (Emma v2 + LangGraph)
#   - vllm: GPU inference for LLM (Qwen3-4B)
#   - background-worker: Async task processing (Celery) for verification
#   - api: Main backend API (optional, for UI integration)

services:
  # =============================================================================
  # PostgreSQL with Apache AGE - Graph Database Extension
  # =============================================================================
  db:
    image: apache/age:release_PG15_1.6.0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Redis - Cache and Session Storage
  # =============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Weaviate - Vector Database
  # =============================================================================
  weaviate:
    image: semitechnologies/weaviate:1.28.3
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - backend-network
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # vLLM - GPU Inference Server (Qwen2.5-7B-Instruct FP16 - NO QUANTIZATION)
  # =============================================================================
  # Using FP16 (full precision) for maximum quality
  # VRAM: ~14GB model + ~6GB KV cache = ~20GB (fits in 24GB)
  vllm:
    image: vllm/vllm-openai:v0.8.5.post1
    ports:
      - "8001:8000"
    networks:
      - backend-network
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_LOGGING_LEVEL=INFO
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      # NO quantization - using full FP16 precision for best quality
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--enforce-eager"
      - "--trust-remote-code"
      # Enable tool calling for Emma v2 (native async client)
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped


  # =============================================================================
  # Apache Tika - Document Text Extraction
  # =============================================================================
  tika:
    image: apache/tika:3.1.0.0
    environment:
      - JAVA_OPTS=-Xms1g -Xmx8g
    deploy:
      resources:
        limits:
          memory: 10g
    networks:
      - backend-network
    restart: unless-stopped

  # =============================================================================
  # TextExtract Service - Text Extraction API
  # =============================================================================
  textextract-service:
    build:
      context: ../microservices/textextract-service
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 10g
    depends_on:
      - tika
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - TIKA_URL=http://tika:9998
    volumes:
      - ../microservices/textextract-service/app:/app/app:ro
      - easyocr_models:/root/.EasyOCR
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Weaviate Service - RAG Pipeline
  # =============================================================================
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    ports:
      - "8007:8000"
    depends_on:
      weaviate:
        condition: service_healthy
      vllm:
        condition: service_healthy
      db:
        condition: service_healthy
      textextract-service:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - TEXT_EXTRACTION_SERVICE_URL=http://textextract-service:8000
      # OCR: disabled during bulk indexing (Tika handles text extraction)
      - ENHANCED_OCR_ENABLED=false
      # vLLM Configuration (Qwen2.5-7B-Instruct-AWQ)
      - VLLM_ENABLED=${VLLM_ENABLED:-true}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - VLLM_ENABLE_THINKING=${VLLM_ENABLE_THINKING:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      # Embedding Configuration (BGE-M3 local)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence-transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
      - MULTIMODAL_EMBEDDING_ENABLED=${MULTIMODAL_EMBEDDING_ENABLED:-false}
      # Agent settings
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - DEFAULT_WORKFLOW=${DEFAULT_WORKFLOW:-auto}
      - AGENT_FRAMEWORK=${AGENT_FRAMEWORK:-qwen-agent}
      # Knowledge Tree Service
      - KNOWLEDGE_TREE_SERVICE_URL=http://knowledge-tree-service:8011
      # Suppress warnings
      - PYTHONWARNINGS=ignore::DeprecationWarning:httpx._models,ignore::DeprecationWarning:spacy.cli._util,ignore::DeprecationWarning:pydantic
    volumes:
      - ../microservices/weaviate-service/app:/app/app:ro
      - ../microservices/weaviate-service/config:/app/config:ro
      - ../microservices/weaviate-service/scripts:/app/scripts:ro
      - huggingface_cache:/root/.cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Knowledge Tree Service - Structural Context (Apache AGE)
  # =============================================================================
  knowledge-tree-service:
    build:
      context: ../microservices/knowledge-tree-service
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - AGE_DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - RAG_KNOWLEDGE_GRAPH_ENABLED=${RAG_KNOWLEDGE_GRAPH_ENABLED:-true}
      - ACTIVE_SECTOR=${ACTIVE_SECTOR:-}
      - AGE_GRAPH_NAME=${AGE_GRAPH_NAME:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ../microservices/knowledge-tree-service/app:/app/app:ro
      - ../microservices/emma-agent-service/config/graphs:/app/config/graphs:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8011", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Emma Agent Service - AI Agent Orchestration
  # =============================================================================
  # Provides:
  #   - Emma v2 agent with LLM-based reasoning (replaces SLM Router)
  #   - LangGraph multi-agent orchestration
  #   - Session and conversation management
  #   - Domain-specific specialists (legal, fiscal, privacy, etc.)
  # =============================================================================
  emma-agent-service:
    build:
      context: ../microservices/emma-agent-service
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    depends_on:
      weaviate-service:
        condition: service_healthy
      knowledge-tree-service:
        condition: service_healthy
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      langfuse:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Weaviate Service connection (for RAG)
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8000
      - WEAVIATE_SERVICE_TIMEOUT=120
      # Knowledge Tree Service (structural context)
      - KNOWLEDGE_TREE_SERVICE_URL=${KNOWLEDGE_TREE_SERVICE_URL:-http://knowledge-tree-service:8011}
      - KNOWLEDGE_TREE_SERVICE_TIMEOUT=30
      # Multi-Pipeline RAG Sector
      - ACTIVE_SECTOR=${ACTIVE_SECTOR:-}
      # vLLM Configuration (Qwen2.5-7B-Instruct-AWQ)
      - VLLM_ENABLED=${VLLM_ENABLED:-true}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - VLLM_ENABLE_THINKING=${VLLM_ENABLE_THINKING:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      # Redis for sessions
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Database for persistence
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      # Agent settings
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - DEFAULT_WORKFLOW=${DEFAULT_WORKFLOW:-auto}
      - AGENT_MAX_TURNS=15
      - AGENT_TIMEOUT_SECONDS=300
      # Single-tenant mode for on-premise
      - SINGLE_TENANT_MODE=true
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      # Langfuse - Prompt Management & LLM Observability
      - LANGFUSE_ENABLED=true
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-emma-dev}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-emma-dev}
      - USE_LANGFUSE_PROMPTS=${USE_LANGFUSE_PROMPTS:-true}
      # Background Worker (for Celery verification tasks)
      - BACKGROUND_WORKER_URL=http://background-worker:8100
      # Upload limits (temp file processing)
      - EMMA_UPLOAD_MAX_CHARS_PER_DOC=${EMMA_UPLOAD_MAX_CHARS_PER_DOC:-15000}
      - EMMA_UPLOAD_MAX_TOTAL_CHARS=${EMMA_UPLOAD_MAX_TOTAL_CHARS:-40000}
      # Default Location for Social Channels
      - DEFAULT_LOCATION_CITY=${DEFAULT_LOCATION_CITY:-Molina de Segura}
      - DEFAULT_LOCATION_REGION=${DEFAULT_LOCATION_REGION:-Región de Murcia}
      - DEFAULT_LOCATION_COUNTRY=${DEFAULT_LOCATION_COUNTRY:-España}
      - DEFAULT_LOCATION_TIMEZONE=${DEFAULT_LOCATION_TIMEZONE:-Europe/Madrid}
      # RLM (Recursive Language Models) Configuration
      - RLM_ENABLED=${RLM_ENABLED:-false}
      - RLM_TOKEN_THRESHOLD=${RLM_TOKEN_THRESHOLD:-16000}
      - RLM_CHUNK_SIZE=${RLM_CHUNK_SIZE:-6000}
      - RLM_CHUNK_OVERLAP=${RLM_CHUNK_OVERLAP:-500}
      - RLM_MAX_DEPTH=${RLM_MAX_DEPTH:-3}
      - RLM_MAX_CHUNKS=${RLM_MAX_CHUNKS:-20}
      # Web Search (Tavily primary, DuckDuckGo fallback)
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-5}
      - WEB_SEARCH_REGION=${WEB_SEARCH_REGION:-es-es}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Suppress warnings
      - PYTHONWARNINGS=ignore::DeprecationWarning:httpx._models,ignore::DeprecationWarning:pydantic
    volumes:
      - ../microservices/emma-agent-service/app:/app/app:ro
      - ../microservices/emma-agent-service/config:/app/config:ro
      - huggingface_cache:/root/.cache/huggingface
      - fastembed_cache:/tmp/fastembed_cache
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8009", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # Background Worker - Async task processing (Celery)
  # =============================================================================
  # Handles: claim verification, preview generation, indexing retries
  background-worker:
    build:
      context: ..
      dockerfile: microservices/background-worker/Dockerfile
    command: ["/app/backend/microservices/background-worker/start.sh"]
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Web Search (DuckDuckGo)
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-3}
      - WEB_SEARCH_REGION=${WEB_SEARCH_REGION:-es-es}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ../:/app/backend
      - ../../credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Emma Reactive Worker - Event listener for reactive AI
  # =============================================================================
  # Listens to Redis Streams events and dispatches triggers/actions
  emma-reactive-worker:
    build:
      context: ../microservices/emma-agent-service
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      emma-agent-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVENT_CONSUMER_GROUP=emma_reactive
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8000
      - VLLM_ENABLED=${VLLM_ENABLED:-true}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - SINGLE_TENANT_MODE=true
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - ACTIVE_SECTOR=${ACTIVE_SECTOR:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
    volumes:
      - ../microservices/emma-agent-service/app:/app/app:ro
      - ../microservices/emma-agent-service/config:/app/config:ro
    command: ["python", "-m", "app.workers.event_listener"]
    restart: unless-stopped

  # =============================================================================
  # ngrok - Tunnel for webhooks (Slack, Telegram, WhatsApp)
  # =============================================================================
  # Exposes emma-agent-service to the internet for channel webhook callbacks.
  # Requires NGROK_AUTHTOKEN from https://dashboard.ngrok.com/get-started/your-authtoken
  # After startup, check logs: docker compose logs ngrok | grep "url="
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "emma-agent-service:8009", "--log=stdout"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    ports:
      - "4040:4040"  # ngrok web UI (inspect requests)
    restart: unless-stopped
    profiles:
      - webhooks  # Only starts with: docker compose --profile webhooks up

  # =============================================================================
  # MCP Alfresco Server - Alfresco sync, indexing & MCP tools
  # =============================================================================
  mcp-alfresco:
    build:
      context: ../microservices/mcp-alfresco-server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - CONNECTOR_CACHE_TTL=${CONNECTOR_CACHE_TTL:-300}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      - ../microservices/mcp-alfresco-server/app:/app/app:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # MCP Google Drive Server - Google Drive sync, indexing & MCP tools
  # =============================================================================
  mcp-google-drive:
    build:
      context: ../microservices/mcp-google-drive-server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/oauth/callback}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - CONNECTOR_CACHE_TTL=${CONNECTOR_CACHE_TTL:-300}
    volumes:
      - ../microservices/mcp-google-drive-server/app:/app/app:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Main API - Backend for UI integration
  # =============================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      weaviate-service:
        condition: service_healthy
      emma-agent-service:
        condition: service_healthy
      mcp-storage:
        condition: service_healthy
      mcp-alfresco:
        condition: service_healthy
      mcp-google-drive:
        condition: service_healthy
      presentation-service:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - SIGNATURE_ENCRYPTION_KEY=${SIGNATURE_ENCRYPTION_KEY}
      - ALLOW_ALL_CORS=true
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - CAG_SERVICE_URL=${CAG_SERVICE_URL:-http://weaviate-service:8000}
      # Emma Agent Service (AI chat)
      - EMMA_SERVICE_URL=${EMMA_SERVICE_URL:-http://emma-agent-service:8009}
      - PRESENTATION_SERVICE_URL=${PRESENTATION_SERVICE_URL:-http://presentation-service:8000}
      - MCP_STORAGE_URL=${MCP_STORAGE_URL:-http://mcp-storage:8000}
      - MCP_ALFRESCO_URL=${MCP_ALFRESCO_URL:-http://mcp-alfresco:8000}
      - MCP_GOOGLE_DRIVE_URL=${MCP_GOOGLE_DRIVE_URL:-http://mcp-google-drive:8000}
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - REDIS_HOST=redis
      - WEAVIATE_URL=http://weaviate:8080
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}
      - DEPLOYMENT_MODE=on_premise
      # OIDC/KeyCloak Configuration
      - OIDC_ISSUER=${OIDC_ISSUER:-http://nouxcube.local.es:8085/realms/nouxcube}
      - OIDC_INTERNAL_ISSUER=${OIDC_INTERNAL_ISSUER:-http://keycloak:8080/realms/nouxcube}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-nouxcube-backend}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-nouxcube-backend-secret-change-in-production}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-nouxcube-frontend}
    volumes:
      - ../app:/app/app:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../core:/app/core:ro
      - ../modules:/app/modules:ro
      - ../../credentials:/app/credentials:ro
      - local_storage_data:/app/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # =============================================================================
  # KeyCloak - OAuth/OIDC Server for SSO
  # =============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8085:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Keycloak 26 hostname configuration
      # KC_HOSTNAME sets the public hostname that will be used in all URLs (including tokens)
      - KC_HOSTNAME=http://nouxcube.local.es:8085
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_SPI_THEME_DEFAULT=bufete-lexnova
    volumes:
      - ./keycloak/themes/bufete-lexnova:/opt/keycloak/themes/bufete-lexnova:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - backend-network
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3;cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # MCP Storage Server - Local File Storage (On-Premise)
  # =============================================================================
  mcp-storage:
    build:
      context: ../microservices/mcp-storage-server
      dockerfile: Dockerfile
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      # Use local filesystem storage instead of GCS
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/storage
      - LOCAL_STORAGE_BASE_URL=${LOCAL_STORAGE_BASE_URL:-http://mcp-storage:8000}
      - SIGNED_URL_SECRET=${SIGNED_URL_SECRET:-change-this-secret-in-production}
      - SIGNED_URL_EXPIRATION=${SIGNED_URL_EXPIRATION:-3600}
    volumes:
      - ../microservices/mcp-storage-server/app:/app/app:ro
      # Persistent local storage volume
      - local_storage_data:/app/storage
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # NouxCube Presentation Service - PowerPoint Generation
  # =============================================================================
  presentation-service:
    build:
      context: ../microservices/presentation-service
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      mcp-storage:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - PRESENTATION_API_KEY=${MICROSERVICES_API_KEY}
      - PRESENTATION_VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - PRESENTATION_VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - PRESENTATION_STORAGE_SERVICE_URL=${MCP_STORAGE_URL:-http://mcp-storage:8000}
      - PRESENTATION_MAIN_API_URL=${MAIN_API_URL:-http://api:8000}
      - PRESENTATION_PUBLIC_API_URL=${PUBLIC_API_URL:-http://nouxcube.local.es:8000}
      - PRESENTATION_LOCAL_STORAGE_PATH=/app/storage
      - DEFAULT_LANGUAGE=${PRESENTATION_DEFAULT_LANGUAGE:-es-ES}
      - DEFAULT_TEMPLATE=${PRESENTATION_DEFAULT_TEMPLATE:-corporate}
      - DEFAULT_MAX_SLIDES=${PRESENTATION_DEFAULT_MAX_SLIDES:-10}
    volumes:
      - ../microservices/presentation-service/app:/app/app:ro
      - ../microservices/presentation-service/templates:/app/templates:ro
      - local_storage_data:/app/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/ping').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # Langfuse - LLM Observability & Prompt Management
  # =============================================================================
  # Core component for:
  # - Prompt versioning and management (Web UI)
  # - A/B testing for prompts
  # - LLM tracing and observability
  # - Rollback capabilities
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3002:3000"  # Host 3002 (3000-3001 used by Next.js)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    environment:
      # Database (uses separate database to avoid schema conflicts)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_password}@db:5432/langfuse
      # Auth
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme-langfuse-secret-key-32chars}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3002}
      - SALT=${LANGFUSE_SALT:-changeme-langfuse-salt-key}
      # Telemetry (optional, can disable)
      - TELEMETRY_ENABLED=false
      # Init admin user (for first run)
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-langfuse-admin-password}
      # Project/Org init
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-NouxCubeIA}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-Emma}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-emma-dev}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-emma-dev}
    healthcheck:
      test: ["CMD-SHELL", "IP=$(hostname -i) && node -e \"require('http').get('http://'+'$IP'+':3000/api/public/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  vllm_cache:
  huggingface_cache:
  fastembed_cache:
  keycloak_data:
  local_storage_data:
  easyocr_models:
