services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: nouxcube_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d nouxcube_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    env_file:
      - ../.env.test
    environment:
      TESTING: "true"
      POSTGRES_SERVER: test-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: nouxcube_test
      DATABASE_URL: postgresql://test_user:test_password@test-db:5432/nouxcube_test
      REDIS_HOST: test-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://test-redis:6379/1
      MIN_HEALTHY_MICROSERVICES: "0"
      MIN_AVAILABLE_SERVICES: "2"
    volumes:
      - ../app:/app/app:ro
      - ../tests:/app/tests:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../migrations:/app/migrations:ro
      - test_coverage:/app/coverage_report
    command: ["bash", "-lc", "pytest tests -v"]

volumes:
  test_coverage:
