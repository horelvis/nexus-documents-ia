
services:
  # Servicio para ejecutar tests
  test-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      # Variables específicas para testing
      - POSTGRES_SERVER=test-db
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=test_db
      - TESTING=true
      - SECRET_KEY=test-secret-key-never-use-in-production
      - GCS_BUCKET_NAME=test-bucket
      - LANGCHAIN_SERVICE_URL=http://test-langchain-service:8001
      - QDRANT_HOST=test-qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=test-redis  
      - REDIS_PORT=6379
      # Configuración para tests
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TESTING=true
      - GCS_PROJECT_ID=test-project-id
      - GCS_BUCKET_NAME=test-bucket
      - GCS_CREDENTIALS=
      - GCS_REGION=europe-west1
      # Storage microservice configuration
      - STORAGE_SERVICE_URL=http://test-storage-service:8001
      - API_KEY=test-storage-api-key-12345
      - GOTENBERG_BASE_URL=http://test-gotenberg:3000
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-qdrant:
        condition: service_started
      test-ollama-service:
        condition: service_healthy
      test-langchain-service:
        condition: service_healthy
      test-storage-service:
        condition: service_healthy
      test-gotenberg:
        condition: service_started
    networks:
      - test-network
    volumes:
      # Montar solo lo necesario para tests
      - ../tests:/app/tests:ro
      - ../app:/app/app:ro
      - ../credentials:/app/credentials:ro
      - test_coverage:/app/coverage_report
    command: bash -c "
      echo '🔧 Instalando dependencias...' &&
      pip install pytest pytest-cov pytest-asyncio httpx pytest-mock psycopg2-binary &&
      echo '⏳ Esperando servicios...' &&
      sleep 10 &&
      echo '✅ Servicios listos' &&
      echo '🧪 Ejecutando tests...' &&
      pytest tests -v --durations=10 --cov=app --cov-report=term-missing --cov-report=html:/app/coverage_report --cov-fail-under=70 --tb=short --maxfail=5 &&
      echo '✅ Tests completados'
      "

  # Base de datos PostgreSQL para tests
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      # Base de datos en memoria para máxima velocidad
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=1g

  # Redis para tests
  test-redis:
    image: redis:alpine
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data:rw,noexec,nosuid,size=100m

  test-qdrant:
    image: qdrant/qdrant:v1.7.4
    networks:
      - test-network
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333 # Qdrant listens on 6333 for HTTP
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    ports:
      - "6333:6333" # Expose Qdrant HTTP port for potential direct access/debugging
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet -T 5 http://localhost:6333/healthz || exit 1"]
      interval: 10s       # Aumentado de 5s
      timeout: 5s         # Aumentado de 3s
      retries: 6          # Aumentado de 5
      start_period: 20s   # Aumentado de 10s
    tmpfs:
      - /qdrant/storage:rw,noexec,nosuid,size=500m

  # Ollama microservice for tests
  test-ollama-service:
    build:
      context: ../microservices/ollama-service
      dockerfile: Dockerfile
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      - PYTHONPATH=/app
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    tmpfs:
      - /root/.ollama:rw,noexec,nosuid,size=2g

  # LangChain microservice for tests
  test-langchain-service:
    build:
      context: ../microservices/langchain-service
      dockerfile: Dockerfile
    environment:
      - QDRANT_HOST=test-qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://test-ollama-service:11434
      - OLLAMA_MODEL=llama3.2
      - EMBEDDING_MODEL=nomic-embed-text
    networks:
      - test-network
    depends_on:
      test-qdrant:
        condition: service_started
      test-ollama-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Storage microservice for tests
  test-storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    environment:
      - STORAGE_API_KEY=test-storage-api-key-12345
      - GCS_PROJECT_ID=tu-project-id
      - GCS_CREDENTIALS=/app/credentials/nexus-document-ia-04252dae0146.json
      - GCS_BUCKET_NAME=test-docs-eu
      - SIGNED_URL_EXPIRATION=3600
      - MAX_UPLOAD_SIZE=104857600
      - RATE_LIMIT_PER_MINUTE=100  # Más permisivo para tests
      - DEBUG=true
      - TESTING=true
    networks:
      - test-network
    volumes:
      - ../credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Gotenberg service for tests
  test-gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  test_coverage:
    driver: local