# TLS-terminating reverse proxy for browser-accessible services.
# Internal Docker services stay on HTTP; nginx adds HTTPS for external access.
#
# Uses Docker's embedded DNS (127.0.0.11) with a 10s TTL so that container
# IP changes (after `docker compose up -d`) are picked up automatically
# without restarting this proxy.

# Docker DNS resolver — re-resolves service names every 10s
resolver 127.0.0.11 valid=10s ipv6=off;

# --- HTTP: ACME challenge + HTTPS redirect (port 80) ---
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Frontend On-Premise (port 443) ---
server {
    listen 443 ssl;
    server_name nouxcubeai.ddns.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # Frontend container runs Next.js on internal port 3000; TLS terminated
        # here. For dev-on-host workflows (npm run dev on host:3001), swap this
        # proxy_pass to http://172.18.0.1:3001 and reload nginx.
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (Next.js HMR + Turbopack hot reload)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- Main API (port 8000) ---
server {
    listen 8000 ssl;
    server_name nouxcubeai.ddns.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # CORS: frontend on :443 calls API on :8000 (different port = different origin)
    set $cors_origin "https://nouxcubeai.ddns.net";

    location / {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, X-API-Key, Accept, Cache-Control' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            return 204;
        }

        # Variable forces nginx to re-resolve DNS via the resolver directive
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # NOTE: Do NOT add CORS headers here — FastAPI CORSMiddleware already
        # sets them on actual responses. Adding them in nginx would duplicate
        # the Access-Control-Allow-Origin header, which browsers reject.

        # SSE streaming support (no buffering)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}

# --- Emma Agent Service (port 8009) ---
server {
    listen 8009 ssl;
    server_name nouxcubeai.ddns.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # CORS: frontend on :443 calls Emma on :8009
    set $cors_origin "https://nouxcubeai.ddns.net";

    # WebSocket endpoints
    location /emma/ws/ {
        set $upstream_emma http://emma-agent-service:8009;
        proxy_pass $upstream_emma$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # SSE streaming endpoints (includes LangGraph protocol adapter /api/threads/*/runs/stream)
    location ~ ^/(emma/query/stream|emma/query/resume/stream|verified/generate/stream|verified/session/.+/resume/stream|predictive/analyze/stream|api/threads/.+/runs/stream) {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, Accept, Cache-Control' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            return 204;
        }

        set $upstream_emma http://emma-agent-service:8009;
        proxy_pass $upstream_emma$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # NOTE: CORS on actual responses handled by FastAPI/emma-agent-service.
        # Do NOT add_header here to avoid duplicate Access-Control-Allow-Origin.

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # All other endpoints
    location / {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            return 204;
        }

        set $upstream_emma http://emma-agent-service:8009;
        proxy_pass $upstream_emma$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # NOTE: CORS on actual responses handled by emma-agent-service.

        proxy_read_timeout 120s;
    }
}

# --- Weaviate Service (port 8007) ---
server {
    listen 8007 ssl;
    server_name nouxcubeai.ddns.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $upstream_weaviate http://weaviate-service:8000;
        proxy_pass $upstream_weaviate$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# --- KeyCloak (port 8085) ---
# KeyCloak runs HTTP-only internally; nginx terminates TLS.
server {
    listen 8085 ssl;
    server_name nouxcubeai.ddns.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $upstream_keycloak http://keycloak:8080;
        proxy_pass $upstream_keycloak$request_uri;
        proxy_set_header Host              $host:8085;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  8085;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 120s;
    }
}

# Required for WebSocket $connection_upgrade variable
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
