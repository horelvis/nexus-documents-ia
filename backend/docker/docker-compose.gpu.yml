version: '3.8'

# GPU-specific overrides for better performance
services:
  ollama-service:
    # Use NVIDIA runtime for GPU support
    runtime: nvidia
    environment:
      # Model configuration with GPU optimization
      - OLLAMA_DEFAULT_MODEL=llama3.2
      - OLLAMA_EMBEDDING_MODEL=all-minilm:latest
      - EMBEDDING_MODEL=all-minilm:latest
      # Force GPU usage
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_GPU_LAYERS=999
      - OLLAMA_CUDA=1
      # Performance tuning for GPU
      - OLLAMA_NUM_PARALLEL=8  # Increase parallel processing with GPU
      - OLLAMA_MAX_LOADED_MODELS=5  # Can handle more models with GPU
      - OLLAMA_NUM_GPU=1  # Number of GPUs to use
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          # No memory limits for GPU - let it use what it needs
          memory: 16G
    # GPU-specific health check
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi && curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s