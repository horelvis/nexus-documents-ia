
services:
  # Servicio principal de la API - DEVELOPMENT MODE
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      langextract-service:
        condition: service_healthy
      elasticsearch-service:
        condition: service_healthy
      textextract-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      # Unified API Key for all microservices
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - SIGNATURE_ENCRYPTION_KEY=${SIGNATURE_ENCRYPTION_KEY}
      - ALLOW_ALL_CORS=true
      # Services URLs
      - STORAGE_SERVICE_URL=http://storage-service:8000
      - STORAGE_SERVICE_INTERNAL_URL=http://storage-service:8000
      - CAG_SERVICE_URL=http://weaviate-service:8000
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8000
      - LANGEXTRACT_SERVICE_URL=http://langextract-service:8000
      - TEXT_EXTRACTION_SERVICE_URL=http://textextract-service:8000
      - ELASTICSEARCH_SERVICE_URL=http://elasticsearch-service:8000
      - TEMPORALIO_SERVICE_URL=http://temporalio-service:8000
      - TEMPLATE_EDITOR_SERVICE_URL=http://template-editor-service:8000
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - GOTENBERG_BASE_URL=http://gotenberg:3000
      # Infrastructure
      - REDIS_HOST=redis
      - WEAVIATE_URL=http://weaviate:8080
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Migration settings
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}
    volumes:
      # Montar código fuente para desarrollo
      - ../app:/app/app:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../migrations:/app/migrations:ro
      - ../tests:/app/tests:ro
      # Montar credentials para desarrollo (ruta corrected a la carpeta raíz)
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch Service - DEVELOPMENT MODE
  elasticsearch-service:
    build:
      context: ../microservices/elasticsearch-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8005:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/elasticsearch-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Storage Service - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8003:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/storage-service/app:/app/app:ro
      # Montar credentials para GCS (usar carpeta raíz)
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LangExtract Service - DEVELOPMENT MODE
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8009:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - OLLAMA_HOST=http://genai-ollama:11434
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/langextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Text Extraction Service - DEVELOPMENT MODE
  textextract-service:
    build:
      context: ../microservices/textextract-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8012:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
    volumes:
      - ../microservices/textextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Weaviate Service - DEVELOPMENT MODE
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8007:8000"
    depends_on:
      weaviate:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/weaviate-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TemporalIO Service - DEVELOPMENT MODE
  temporalio-service:
    build:
      context: ../microservices/temporalio-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8010:8000"
    depends_on:
      temporalio-server:
        condition: service_healthy
      weaviate-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # TemporalIO Configuration
      - TEMPORALIO_HOST=temporalio-server
      - TEMPORALIO_PORT=7233
      - TEMPORALIO_NAMESPACE=nexus-workflows
      - TEMPORALIO_TASK_QUEUE=nexus-workflow-tasks
      # Service URLs
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8007
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://genai-ollama:11434
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/temporalio-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Template Editor Service - DEVELOPMENT MODE
  template-editor-service:
    build:
      context: ../microservices/template-editor-service
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8011:8000"
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - TEMPLATE_EDITOR_DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/template-editor-service/app:/app/app:ro
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TemporalIO Server - DEVELOPMENT MODE (auto-setup to install schema)
  temporalio-server:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "0.0.0.0:7233:7233"   # gRPC port
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nexus_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-nexus_password}
      - POSTGRES_SEEDS=db
      - SKIP_DB_CREATE=false
      # Explicit DB names so auto-setup runs migrations correctly
      - DBNAME=temporalio-nexus
      - VISIBILITY_DBNAME=temporalio-nexus_visibility
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - ./temporalio-config:/etc/temporal/config
      - temporalio_data:/etc/temporal/data
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "temporalio-server:7233"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # TemporalIO Web UI - DEVELOPMENT MODE
  temporalio-ui:
    image: temporalio/ui:2.27.3
    ports:
      - "0.0.0.0:8233:8080"   # Web UI port
    depends_on:
      temporalio-server:
        condition: service_healthy
    networks:
      - backend-network
    environment:
      - TEMPORAL_ADDRESS=temporalio-server:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-ollama-models.sh:/docker-entrypoint-initdb.d/init-ollama-models.sh
      - ./scripts/init-temporal-dbs.sh:/docker-entrypoint-initdb.d/init-temporal-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    ports:
      - "0.0.0.0:6379:6379"
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Weaviate para embeddings vectoriales
  weaviate:
    image: semitechnologies/weaviate:1.28.3
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - backend-network
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch para búsqueda híbrida
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "0.0.0.0:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - backend-network
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Qdrant para vectores (alternativo a Weaviate)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "0.0.0.0:6333:6333"
    networks:
      - backend-network
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama para modelos de lenguaje local
  genai-ollama:
    image: ollama/ollama:latest
    ports:
      - "0.0.0.0:11434:11434"
    networks:
      - backend-network
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Gotenberg para conversión de documentos
  gotenberg:
    image: gotenberg/gotenberg:8.7.0
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - backend-network
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--chromium-disable-web-security"
      - "--chromium-allow-file-access-from-files"
      - "--log-level=info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  elasticsearch_data:
  qdrant_data:
  ollama_data:
  temporalio_data:
