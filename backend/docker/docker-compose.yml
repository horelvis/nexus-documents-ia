services:
  # Servicio principal de la API - DEVELOPMENT MODE
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      cag-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      # Unified API Key for all microservices
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Services URLs
      - STORAGE_SERVICE_URL=http://storage-service:8003
      - CAG_SERVICE_URL=http://cag-service:8008
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - GOTENBERG_BASE_URL=http://gotenberg:3000
      # Infrastructure
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      # General
      - DEBUG=${DEBUG:-true}
      - TESTING=${TESTING:-false}
      - ALLOW_ALL_CORS=${ALLOW_ALL_CORS:-true}
    volumes:
      - ../:/app  # Live code reloading for development
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "warning"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  # Qdrant para vectores
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # CAG microservice - DEVELOPMENT MODE
  cag-service:
    build:
      context: ../microservices/cag-service
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    depends_on:
      - qdrant
      - redis
      - db
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/nexus_db
      - SERPER_API_KEY=${SERPER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
      - DEBUG=${DEBUG:-true}  # Enable reload in dev
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/cag-service/app:/app/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Storage Microservice - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      - redis
    networks:
      - backend-network
    volumes:
      - ../../credentials:/app/credentials:ro
      # Mount the Python code for live reloading
      - ../microservices/storage-service/app:/app/app:rw
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - GCS_PROJECT_ID=nexus-document-ia
      - GCS_CREDENTIALS=/app/credentials/nexusdocs360-pre-7d2cb195adc7.json
      - GCS_BUCKET_NAME=nexus-docs-eu
      - SIGNED_URL_EXPIRATION=3600
      - MAX_UPLOAD_SIZE=104857600
      - RATE_LIMIT_PER_MINUTE=10
      - DEBUG=${DEBUG:-true}
      - TESTING=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Signature microservice
  signature-service:
    build:
      context: ../microservices/signature-service
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    networks:
      - backend-network
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/signature-service/app:/app/app:rw
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - MAIN_API_URL=http://backend:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=${DEBUG:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # LangExtract service for structured document extraction
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    container_name: langextract-service
    environment:
      - OLLAMA_HOST=http://genai-ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY:-dev-api-key-2024}
      - DEFAULT_PROVIDER=ollama
    ports:
      - "8009:8009"
    depends_on:
      - genai-ollama
    volumes:
      - ../microservices/langextract-service/app:/app/app:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gotenberg service for document conversion
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Ollama service for local LLM inference
  genai-ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    networks:
      - backend-network
    volumes:
      - genai_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      # GPU configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  langgraph_checkpoints:
  genai_ollama_data:
