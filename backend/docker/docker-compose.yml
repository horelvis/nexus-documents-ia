services:
  # Servicio principal de la API - DEVELOPMENT MODE
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - qdrant
      - langchain-service
      - langgraph-service
      - ollama-service
      - storage-service
      - gotenberg
    networks:
      - backend-network
    env_file:
      - ../.env
    environment:
      # Services URLs
      - STORAGE_SERVICE_URL=http://storage-service:8001
      - STORAGE_API_KEY=dev-storage-api-key-12345
      - LANGCHAIN_SERVICE_URL=http://langchain-service:8001
      - LANGGRAPH_SERVICE_URL=http://langgraph-service:8007
      - OLLAMA_BASE_URL=http://ollama-service:11434
      - GOTENBERG_BASE_URL=http://gotenberg:3000
      # Infrastructure
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      # General
      - DEBUG=${DEBUG:-true}
      - TESTING=${TESTING:-false}
    volumes:
      - ../:/app  # Live code reloading for development
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "warning"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  # Qdrant para vectores
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3


  # LangChain microservice - DEVELOPMENT MODE
  langchain-service:
    build:
      context: ../microservices/langchain-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
      - ollama-service
    networks:
      - backend-network
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama-service:11434
      - OLLAMA_MODEL=llama3.1:8b
      - EMBEDDING_MODEL=nomic-embed-text
      - API_KEY=your-secret-api-key-here
      - DEBUG=true  # Enable reload in dev
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/langchain-service/app:/app/app:rw
    restart: unless-stopped


  # LangGraph microservice - DEVELOPMENT MODE
  langgraph-service:
    build:
      context: ../microservices/langgraph-service
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    depends_on:
      - qdrant
      - ollama-service
      - redis
      - db
    networks:
      - backend-network
    environment:
      - SERVICE_API_KEY=langgraph-secret-key-12345
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama-service:11434
      - LLM_MODEL=llama3.2
      - EMBEDDING_MODEL=nomic-embed-text
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/nexus_db
      - LANGGRAPH_BACKEND=sqlite
      - CHECKPOINT_DB_PATH=/tmp/langgraph_checkpoints.db
      - LOG_LEVEL=INFO
      - DEBUG=true  # Enable reload in dev
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/langgraph-service/app:/app/app:rw
      # Mount checkpoints directory
      - langgraph_checkpoints:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Langflow - Visual agent builder for development
  langflow:
    image: langflowai/langflow:latest
    container_name: nexus_langflow
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow.db
      - LANGFLOW_CONFIG_DIR=/app/config
      - LANGFLOW_COMPONENTS_PATH=/app/components
      - LANGFLOW_LOG_LEVEL=info
      - LANGFLOW_OPEN_BROWSER=false
      - LANGFLOW_REMOVE_API_KEYS=false
      # Connect to local Ollama
      - OLLAMA_BASE_URL=http://ollama-service:11434
      # Optional: Set default models
      - DEFAULT_LLM_MODEL=llama3.2
      - DEFAULT_EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - langflow_data:/app
      - ./langflow/flows:/app/flows
      - ./langflow/components:/app/components
    depends_on:
      - ollama-service
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama Microservice - DEVELOPMENT MODE
  ollama-service:
    build:
      context: ../microservices/ollama-service
      dockerfile: Dockerfile
    ports:
      - "11434:11434"  # Ollama server port
      - "8004:8000"    # FastAPI wrapper port
    volumes:
      - ollama_data:/root/.ollama
      # Mount the Python code for live reloading
      - ../microservices/ollama-service/app:/app/app:rw
    networks:
      - backend-network
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
      - PYTHONPATH=/app
      - DEBUG=true  # Enable reload in dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Storage Microservice - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    ports:
      - "8003:8001"
    depends_on:
      - redis
    networks:
      - backend-network
    volumes:
      - ../credentials:/app/credentials:ro
      # Mount the Python code for live reloading
      - ../microservices/storage-service/app:/app/app:rw
    env_file:
      - ../.env
    environment:
      - API_KEY=dev-storage-api-key-12345
      - GCS_PROJECT_ID=nexus-document-ia
      - GCS_CREDENTIALS=/app/credentials/nexus-document-ia-04252dae0146.json
      - GCS_BUCKET_NAME=nexus-docs-eu
      - SIGNED_URL_EXPIRATION=3600
      - MAX_UPLOAD_SIZE=104857600
      - RATE_LIMIT_PER_MINUTE=10
      - DEBUG=true
      - TESTING=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Gotenberg service for document conversion
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  langflow_data:
  langgraph_checkpoints:
