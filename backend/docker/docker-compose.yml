
services:
  # Servicio principal de la API - DEVELOPMENT MODE
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # API expone puerto para el host; otros servicios internos no lo necesitan
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      langextract-service:
        condition: service_healthy
      elasticsearch-service:
        condition: service_healthy
      textextract-service:
        condition: service_healthy
      background-worker:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      # Unified API Key for all microservices
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - SIGNATURE_ENCRYPTION_KEY=${SIGNATURE_ENCRYPTION_KEY}
      - ALLOW_ALL_CORS=true
      # Services URLs
      - STORAGE_SERVICE_URL=${STORAGE_SERVICE_URL:-http://storage-service:8000}
      - STORAGE_SERVICE_INTERNAL_URL=${STORAGE_SERVICE_INTERNAL_URL:-http://storage-service:8000}
      - CAG_SERVICE_URL=${CAG_SERVICE_URL:-http://weaviate-service:8000}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - LANGEXTRACT_SERVICE_URL=${LANGEXTRACT_SERVICE_URL:-http://langextract-service:8000}
      - TEXT_EXTRACTION_SERVICE_URL=${TEXT_EXTRACTION_SERVICE_URL:-http://textextract-service:8000}
      - ELASTICSEARCH_SERVICE_URL=${ELASTICSEARCH_SERVICE_URL:-http://elasticsearch-service:8000}
      - TEMPLATE_EDITOR_SERVICE_URL=${TEMPLATE_EDITOR_SERVICE_URL:-http://template-editor-service:8000}
      - GOTENBERG_BASE_URL=${GOTENBERG_BASE_URL:-http://gotenberg:3000}
      # Infrastructure
      - REDIS_HOST=redis
      - WEAVIATE_URL=http://weaviate:8080
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Migration settings
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}
    volumes:
      # Montar código fuente para desarrollo
      - ../app:/app/app:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../migrations:/app/migrations:ro
      - ../tests:/app/tests:ro
      # Montar credentials para desarrollo (ruta corrected a la carpeta raíz)
      - ../../credentials:/app/credentials:ro
      # SSL certificates for HTTPS (enables Voice Mode getUserMedia)
      - ./certificates:/app/certificates:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--ssl-keyfile", "/app/certificates/localhost-key.pem", "--ssl-certfile", "/app/certificates/localhost.pem"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch Service - DEVELOPMENT MODE
  elasticsearch-service:
    build:
      context: ../microservices/elasticsearch-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/elasticsearch-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Storage Service - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Rate limit for development (default is 10, too low for dev)
      - RATE_LIMIT_PER_MINUTE=100
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/storage-service/app:/app/app:ro
      # Montar credentials para GCS (usar carpeta raíz)
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LangExtract Service - DEVELOPMENT MODE
  # NOTE: langextract only supports: anthropic, gemini, ollama, openai (NOT vllm)
  # Use gemini as default since it's fast and has good document understanding
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Use separate env vars for langextract to avoid conflict with vllm-based services
      - LLM_PROVIDER=${LANGEXTRACT_LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LANGEXTRACT_LLM_MODEL:-gemini-2.0-flash}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/langextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Text Extraction Service - DEVELOPMENT MODE (uses Apache Tika)
  textextract-service:
    build:
      context: ../microservices/textextract-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    depends_on:
      tika:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - TIKA_URL=${TIKA_URL:-http://tika:9998}
    volumes:
      - ../microservices/textextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Weaviate Service - DEVELOPMENT MODE (uses TEI for embeddings)
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    depends_on:
      weaviate:
        condition: service_healthy
      text-embeddings-inference:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # vLLM Configuration (PRIMARY - high-throughput GPU inference)
      # Model: Qwen3-4B - 32K context, Spanish + tool calling (Hermes-style)
      # 4B model uses ~8-9GB VRAM, leaving room for embeddings and reranker
      - VLLM_ENABLED=${VLLM_ENABLED:-true}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-4B}
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      # Embedding Configuration (TEI - HuggingFace Text Embeddings Inference)
      # Model: BAAI/bge-m3 (1024 dim, 8192 context, 100+ languages)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-tei}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - TEI_URL=${TEI_URL:-http://text-embeddings-inference:8080}
      # Agent Framework settings (Microsoft Agent Framework)
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - DEFAULT_WORKFLOW=${DEFAULT_WORKFLOW:-auto}
      # Suppress known deprecation warnings from third-party libraries
      - PYTHONWARNINGS=ignore::DeprecationWarning:httpx._models,ignore::DeprecationWarning:spacy.cli._util,ignore::DeprecationWarning:pydantic
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/weaviate-service/app:/app/app:ro
      # Montar archivos de configuración de prompts (editable sin rebuild)
      - ../microservices/weaviate-service/config:/app/config:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # GPU access for CrossEncoder reranker (sentence-transformers)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Template Editor Service - DEVELOPMENT MODE
  template-editor-service:
    build:
      context: ../microservices/template-editor-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - TEMPLATE_EDITOR_DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/template-editor-service/app:/app/app:ro
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Background worker microservice (previews, emails, indexing retries)
  background-worker:
    build:
      context: ..
      dockerfile: microservices/background-worker/Dockerfile
    command: ["/app/backend/microservices/background-worker/start.sh"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ../:/app/backend
      - ../../credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-camunda-schema.sql:/docker-entrypoint-initdb.d/init-camunda-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Weaviate para embeddings vectoriales
  weaviate:
    image: semitechnologies/weaviate:1.28.3
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - backend-network
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch para búsqueda híbrida
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - backend-network
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Text Embeddings Inference (TEI) - Dedicated GPU embedding server
  # Model: BAAI/bge-m3 (1024 dim, 8192 context)
  # Multilingual: 100+ languages, dense+sparse+multi-vector embeddings
  # NOTE: Using 'latest' (1.6+) - version 1.5 has a bug with HuggingFace Hub redirects
  text-embeddings-inference:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    networks:
      - backend-network
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_ID=${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - tei_cache:/data
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-m3}", "--port", "8080", "--max-batch-tokens", "16384", "--dtype", "float16", "--auto-truncate"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # vLLM para inferencia de alta velocidad (GPU) - PRIMARY LLM SERVER
  # Requires HF_TOKEN in .env for gated models
  # Official vLLM image with full tool calling support (vLLM >= 0.9.0)
  # Model: Qwen3-4B - Efficient model with excellent Spanish + tool calling
  # ~8-9GB VRAM, 32K native context, performance comparable to larger models
  vllm:
    # Using v0.9.0 for Qwen3 support (requires >= 0.9.x)
    image: vllm/vllm-openai:v0.9.0
    networks:
      - backend-network
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_LOGGING_LEVEL=INFO
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    # Tool calling enabled with --enable-auto-tool-choice
    # 4B model: ~8-9GB VRAM in bfloat16, leaves room for 16K context
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # 8B model loads faster than 14B
    restart: unless-stopped

  # Gotenberg para conversión de documentos
  gotenberg:
    image: gotenberg/gotenberg:8.7.0
    # Servicio interno, no se expone fuera de la red Docker
    networks:
      - backend-network
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--chromium-disable-web-security"
      - "--chromium-allow-file-access-from-files"
      - "--log-level=info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Apache Tika para extracción de texto de documentos
  tika:
    image: apache/tika:3.1.0.0
    # Servicio interno, no se expone fuera de la red Docker
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9998' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Camunda 7 BPM Engine para workflows de aprobación
  camunda:
    image: camunda/camunda-bpm-platform:run-7.22.0
    # Servicio interno, no se expone fuera de la red Docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    environment:
      - DB_DRIVER=org.postgresql.Driver
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-nexus_db}?currentSchema=camunda
      - DB_USERNAME=${POSTGRES_USER:-nexus_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-nexus_password}
      - WAIT_FOR=db:5432
      - WAIT_FOR_TIMEOUT=120
    volumes:
      - camunda_data:/camunda/configuration/resources
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Camunda Service - Python wrapper para workflows BPMN
  camunda-service:
    build:
      context: ../microservices/camunda-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    depends_on:
      camunda:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - CAMUNDA_URL=http://camunda:8080
    volumes:
      - ../microservices/camunda-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # TTS Service - Text-to-Speech using Microsoft VibeVoice
  # Real-time streaming TTS with ~300ms latency
  # Supports: English, Spanish (experimental)
  # GPU required for acceptable performance
  tts-service:
    build:
      context: ../microservices/tts-service
      dockerfile: Dockerfile
    # Expose port for WebSocket connections from frontend
    ports:
      - "0.0.0.0:8010:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # TTS Provider Configuration
      - TTS_PROVIDER=${TTS_PROVIDER:-vibevoice}
      - VIBEVOICE_MODEL_PATH=${VIBEVOICE_MODEL_PATH:-microsoft/VibeVoice-Realtime-0.5B}
      - VIBEVOICE_DEVICE=${VIBEVOICE_DEVICE:-cuda}
      - VIBEVOICE_DEFAULT_VOICE=${VIBEVOICE_DEFAULT_VOICE:-Carter}
      # Google TTS Fallback
      - GOOGLE_TTS_ENABLED=${GOOGLE_TTS_ENABLED:-true}
      - GOOGLE_TTS_DEFAULT_VOICE=${GOOGLE_TTS_DEFAULT_VOICE:-es-ES-Neural2-A}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/credentials/nexus-document-ia-1eb963df24a4.json}
      # HuggingFace token for model download
      - HF_TOKEN=${HF_TOKEN}
      # Redis for audio caching
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=${TTS_CACHE_ENABLED:-true}
    volumes:
      # Mount source code for development
      - ../microservices/tts-service/app:/app/app:ro
      # Mount voice prompts for VibeVoice speakers
      - ../microservices/tts-service/voice_prompts:/app/voice_prompts:ro
      # Mount credentials for Google TTS fallback
      - ../../credentials:/app/credentials:ro
      # HuggingFace cache for model persistence (accessible to appuser)
      - tts_model_cache:/app/.cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # GPU access for VibeVoice model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Model loading takes time
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  elasticsearch_data:
  vllm_cache:  # Cache for HuggingFace models used by vLLM
  tei_cache:   # Cache for TEI embedding models
  camunda_data:
  tts_model_cache:  # Cache for VibeVoice TTS models
