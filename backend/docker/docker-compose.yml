
services:
  # Servicio principal de la API - DEVELOPMENT MODE
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # API expone puerto para el host; otros servicios internos no lo necesitan
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      mcp-storage:
        condition: service_healthy
      langextract-service:
        condition: service_healthy
      background-worker:
        condition: service_started
      podcast-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      # Unified API Key for all microservices
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - SIGNATURE_ENCRYPTION_KEY=${SIGNATURE_ENCRYPTION_KEY}
      - ALLOW_ALL_CORS=true
      # Services URLs
      - STORAGE_SERVICE_URL=${STORAGE_SERVICE_URL:-http://storage-service:8000}
      - STORAGE_SERVICE_INTERNAL_URL=${STORAGE_SERVICE_INTERNAL_URL:-http://storage-service:8000}
      - CAG_SERVICE_URL=${CAG_SERVICE_URL:-http://weaviate-service:8000}
      - WEAVIATE_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - LANGEXTRACT_SERVICE_URL=${LANGEXTRACT_SERVICE_URL:-http://langextract-service:8000}
      - PODCAST_SERVICE_URL=${PODCAST_SERVICE_URL:-http://podcast-service:8000}
      # MCP Configuration (NEW - replaces direct storage-service calls)
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_STORAGE_URL=${MCP_STORAGE_URL:-http://mcp-storage:8000}
      # Infrastructure
      - REDIS_HOST=redis
      - WEAVIATE_URL=http://weaviate:8080
      # Migration settings
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}
    volumes:
      # Montar código fuente para desarrollo
      - ../app:/app/app:ro
      - ../scripts:/app/scripts:ro
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - ../migrations:/app/migrations:ro
      - ../tests:/app/tests:ro
      # Montar credentials para desarrollo (ruta corrected a la carpeta raíz)
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # MCP Storage Server (NEW - replaces storage-service)
  # =============================================================================
  # Model Context Protocol server for file storage operations
  # Provides: upload, download, list, delete, signed_url, move
  # Transport: HTTP/SSE for MCP protocol
  mcp-storage:
    build:
      context: ../microservices/mcp-storage-server
      dockerfile: Dockerfile
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_CREDENTIALS=${GCS_CREDENTIALS:-/app/credentials/nexus-document-ia-04252dae0146.json}
      - GCS_DEFAULT_BUCKET=${GCS_DEFAULT_BUCKET:-nexus-documents}
      - SIGNED_URL_EXPIRATION=${SIGNED_URL_EXPIRATION:-3600}
    volumes:
      # Mount source code for development
      - ../microservices/mcp-storage-server/app:/app/app:ro
      # Mount credentials for GCS
      - ../../credentials:/app/credentials:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # MCP Alfresco Server - Alfresco 7.x ECM Integration
  # =============================================================================
  # Model Context Protocol server for Alfresco document management
  # Provides: search, download, upload, list, versions, move, copy, delete
  # Transport: HTTP/SSE for MCP protocol
  # API: Alfresco Content Services REST API + Search API (AFTS)
  mcp-alfresco:
    profiles: ["alfresco"]  # Enable with: docker compose --profile alfresco up
    build:
      context: ../microservices/mcp-alfresco-server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      # Database connection (reads connector config from backend DB)
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      # Cache settings
      - CONNECTOR_CACHE_TTL=${CONNECTOR_CACHE_TTL:-300}
    volumes:
      # Mount source code for development
      - ../microservices/mcp-alfresco-server/app:/app/app:ro
    command: ["python", "-m", "app.main", "--http", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Storage Service - LEGACY (will be deprecated)
  # TODO: Remove after migrating all code to MCP
  storage-service:
    profiles: ["legacy-storage"]  # Only start with: docker compose --profile legacy-storage up
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_PER_MINUTE=100
    volumes:
      - ../microservices/storage-service/app:/app/app:ro
      - ../../credentials:/app/credentials:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LangExtract Service - DEVELOPMENT MODE
  # NOTE: langextract supports: anthropic, gemini, openai, vllm (ollama legacy)
  # Use gemini as default since it's fast and has good document understanding
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # Use separate env vars for langextract to avoid conflict with vllm-based services
      - LLM_PROVIDER=${LANGEXTRACT_LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LANGEXTRACT_LLM_MODEL:-gemini-2.0-flash}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/langextract-service/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Weaviate Service - DEVELOPMENT MODE
  # Multimodal RAG with unified text+image embeddings
  # Uses Qwen3-VL-Embedding-2B for cross-modal search capabilities
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    # Servicio interno, no se expone fuera de la red Docker
    depends_on:
      weaviate:
        condition: service_healthy
      vllm:
        condition: service_healthy
      qwen3-vl-embedding:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://nexus_user:nexus_password@db:5432/nexus_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # vLLM Configuration (PRIMARY - high-throughput GPU inference)
      # Model: Qwen3-4B-Thinking-2507 - Extended reasoning with automatic thinking mode
      # ~10GB VRAM (FP16 with 32K context), coexists with multimodal embedding (~5GB)
      - VLLM_ENABLED=${VLLM_ENABLED:-true}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-4B-Thinking-2507}
      - VLLM_ENABLE_THINKING=${VLLM_ENABLE_THINKING:-true}
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      # Embedding Configuration (Qwen3-VL-Embedding-2B - Multimodal)
      # Model: Qwen/Qwen3-VL-Embedding-2B (1024 dim, text + images)
      # Replaces TEI/bge-m3 with unified multimodal embeddings
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-qwen3-vl}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://qwen3-vl-embedding:8000/v1}
      # Multimodal is now enabled by default (single unified embedding model)
      - MULTIMODAL_EMBEDDING_ENABLED=${MULTIMODAL_EMBEDDING_ENABLED:-true}
      - MULTIMODAL_EMBEDDING_URL=${MULTIMODAL_EMBEDDING_URL:-http://qwen3-vl-embedding:8000/v1}
      - MULTIMODAL_EMBEDDING_MODEL=${MULTIMODAL_EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      - MULTIMODAL_EMBEDDING_DIMENSIONS=${MULTIMODAL_EMBEDDING_DIMENSIONS:-1024}
      # Reranker uses local CrossEncoder (ms-marco-MiniLM-L-6-v2) in multi_stage_retriever.py
      # No external reranker service needed
      # Agent Framework settings (Qwen-Agent)
      # Qwen-Agent handles tool parsing internally, optimized for Qwen models
      - AGENTS_ENABLED=${AGENTS_ENABLED:-true}
      - DEFAULT_WORKFLOW=${DEFAULT_WORKFLOW:-auto}
      - AGENT_FRAMEWORK=${AGENT_FRAMEWORK:-qwen-agent}
      # MCP Configuration (Model Context Protocol for external data sources)
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_STORAGE_URL=${MCP_STORAGE_URL:-http://mcp-storage:8000}
      - MCP_ALFRESCO_URL=${MCP_ALFRESCO_URL:-http://mcp-alfresco:8000}
      - MCP_SERVERS_CONFIG=${MCP_SERVERS_CONFIG:-/app/config/mcp_servers.yaml}
      - MCP_CONNECTION_TIMEOUT=${MCP_CONNECTION_TIMEOUT:-30}
      # Suppress known deprecation warnings from third-party libraries
      - PYTHONWARNINGS=ignore::DeprecationWarning:httpx._models,ignore::DeprecationWarning:spacy.cli._util,ignore::DeprecationWarning:pydantic
    volumes:
      # Montar código fuente para desarrollo
      - ../microservices/weaviate-service/app:/app/app:ro
      # Montar archivos de configuración de prompts (editable sin rebuild)
      - ../microservices/weaviate-service/config:/app/config:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # GPU access for CrossEncoder reranker (sentence-transformers)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background worker microservice (previews, emails, indexing retries)
  background-worker:
    build:
      context: ..
      dockerfile: microservices/background-worker/Dockerfile
    command: ["/app/backend/microservices/background-worker/start.sh"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - ../:/app/backend
      - ../../credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  # =============================================================================
  # PostgreSQL with Apache AGE - Graph Database Extension
  # =============================================================================
  # Image: apache/age (PostgreSQL 16 + AGE extension pre-installed)
  # Features:
  #   - Cypher query language for graph traversal
  #   - Native graph storage in PostgreSQL
  #   - ACID transactions for graph operations
  #   - Integrated with existing relational data
  # Use case: Knowledge Graph for RAG query expansion and entity relationships
  # Docs: https://age.apache.org/
  db:
    image: apache/age:release_PG15_1.6.0
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Weaviate para embeddings vectoriales
  weaviate:
    image: semitechnologies/weaviate:1.28.3
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - backend-network
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Qwen3-VL-Embedding-2B - MULTIMODAL EMBEDDING SERVICE (ENABLED)
  # =============================================================================
  # Model: Qwen/Qwen3-VL-Embedding-2B (2B params, 1024 dim output)
  # Capabilities:
  #   - Unified text + image embeddings in same vector space
  #   - Cross-modal search: text queries find relevant images/diagrams
  #   - PDF visual content: tables, charts, diagrams, screenshots
  # VRAM: ~5GB (weights + minimal KV cache for short sequences)
  # API: vLLM OpenAI-compatible /v1/embeddings endpoint
  # Docs: https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B
  #
  # RECOMMENDED CONFIGURATION (Multimodal RAG):
  #   LLM: Qwen3-4B-Thinking-2507 (45% VRAM = ~11GB)
  #   Embedding: Qwen3-VL-Embedding-2B (20% VRAM = ~5GB)
  #   Total: ~65% = ~16GB of 24GB, leaves ~8GB buffer
  qwen3-vl-embedding:
    # Custom vLLM image with transformers 4.57+ for Qwen3 model support
    build:
      context: ./vllm-custom
      dockerfile: Dockerfile
    image: vllm-custom:latest
    depends_on:
      vllm:
        condition: service_healthy  # Wait for vLLM to be healthy before starting
    networks:
      - backend-network
    volumes:
      - embedding_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_LOGGING_LEVEL=INFO
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    # Embedding mode configuration - OPTIMIZED FOR COEXISTENCE:
    # --gpu-memory-utilization 0.20: ~5GB, coexists with LLM (45%)
    # --max-model-len 512: embeddings only need short sequences
    # Model weights: ~4.2GB, leaves ~0.8GB for minimal KV cache
    # Combined with vLLM (45%): Total ~65% = 16GB, leaves ~8GB buffer
    command:
      - "--model"
      - "${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-2B}"
      - "--max-model-len"
      - "512"
      - "--gpu-memory-utilization"
      - "0.20"
      - "--trust-remote-code"
      - "--enforce-eager"
      - "--port"
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # =============================================================================
  # Qwen3-4B-Thinking-2507 - PRIMARY LLM SERVER (Extended Reasoning)
  # =============================================================================
  # Model: Qwen/Qwen3-4B-Thinking-2507
  # Optimized for on-premise with 24GB VRAM (RTX 4090)
  # Capabilities:
  #   - Extended reasoning: Automatic <think>...</think> blocks for complex tasks
  #   - 256K native context (use 32K for VRAM efficiency with embedding model)
  #   - Text-only model (no vision) - use with multimodal embedding for images
  # VRAM: ~10GB (FP16 with 32K context)
  # Context: 256K native, 32K recommended when coexisting with embedding model
  # API: OpenAI-compatible /v1/chat/completions
  # Docs: https://huggingface.co/Qwen/Qwen3-4B-Thinking-2507
  #
  # RECOMMENDED CONFIGURATION (Multimodal RAG):
  #   LLM: Qwen3-4B-Thinking-2507 (~10GB) - Extended reasoning for document analysis
  #   Embedding: Qwen3-VL-Embedding-2B (~5GB) - Unified text+image embeddings
  #   Total: ~15GB of 24GB VRAM
  #   Benefits: Cross-modal search (text queries find images), thinking mode
  vllm:
    # Custom vLLM image with transformers 4.57+ for Qwen3 model support
    build:
      context: ./vllm-custom
      dockerfile: Dockerfile
    image: vllm-custom:latest
    networks:
      - backend-network
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_LOGGING_LEVEL=INFO
      - NVIDIA_DISABLE_REQUIRE=1
      - CUDA_VISIBLE_DEVICES=0
    # Qwen3-4B-Thinking-2507 configuration:
    # - Text-only model with automatic thinking mode
    # - Qwen-Agent handles tool parsing internally
    # VRAM Budget (RTX 4090 24GB):
    #   - LLM weights: ~8GB
    #   - KV cache (32K context): ~2GB
    #   - Embedding model: ~5GB (Qwen3-VL-Embedding-2B)
    #   - Total: ~15GB, leaves ~9GB buffer for batching
    # NOTE: Reduced to 32K context to coexist with multimodal embedding
    # For full 256K context, disable multimodal embedding or use external API
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Thinking-2507}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-32768}"
      - "--gpu-memory-utilization"
      - "0.70"
      - "--trust-remote-code"
      # Removed --enforce-eager to allow cudagraph optimization
      # Note: reasoning-parser removed since Qwen3-4B base doesn't use thinking mode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # TTS Service - Text-to-Speech using Microsoft VibeVoice
  # Real-time streaming TTS with ~300ms latency
  # Supports: English, Spanish (experimental)
  # GPU required for acceptable performance
  tts-service:
    build:
      context: ../microservices/tts-service
      dockerfile: Dockerfile
    # Expose port for WebSocket connections from frontend
    ports:
      - "0.0.0.0:8010:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # TTS Provider Configuration
      - TTS_PROVIDER=${TTS_PROVIDER:-vibevoice}
      - VIBEVOICE_MODEL_PATH=${VIBEVOICE_MODEL_PATH:-microsoft/VibeVoice-Realtime-0.5B}
      - VIBEVOICE_DEVICE=${VIBEVOICE_DEVICE:-cuda}
      - VIBEVOICE_DEFAULT_VOICE=${VIBEVOICE_DEFAULT_VOICE:-Carter}
      # Google TTS Fallback
      - GOOGLE_TTS_ENABLED=${GOOGLE_TTS_ENABLED:-true}
      - GOOGLE_TTS_DEFAULT_VOICE=${GOOGLE_TTS_DEFAULT_VOICE:-es-ES-Neural2-A}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/credentials/nexus-document-ia-1eb963df24a4.json}
      # HuggingFace token for model download
      - HF_TOKEN=${HF_TOKEN}
      # Redis for audio caching
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=${TTS_CACHE_ENABLED:-true}
    volumes:
      # Mount source code for development
      - ../microservices/tts-service/app:/app/app:ro
      # Mount voice prompts for VibeVoice speakers
      - ../microservices/tts-service/voice_prompts:/app/voice_prompts:ro
      # Mount credentials for Google TTS fallback
      - ../../credentials:/app/credentials:ro
      # HuggingFace cache for model persistence (accessible to appuser)
      - tts_model_cache:/app/.cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    # GPU access for VibeVoice model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Model loading takes time
    restart: unless-stopped

  # =============================================================================
  # NexusLM Podcast Service - AI Podcast Generation
  # =============================================================================
  # Generates AI podcasts from document notebooks (NotebookLM alternative)
  # Pipeline: Analyze sources → Generate script → Synthesize audio → Stitch
  # Uses:
  #   - vLLM (Qwen3-4B-Thinking) for script generation
  #   - TTS Service (VibeVoice) for voice synthesis
  #   - pydub/ffmpeg for audio stitching
  podcast-service:
    build:
      context: ../microservices/podcast-service
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      tts-service:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      # vLLM for script generation
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-4B-Thinking-2507}
      # TTS Service for audio synthesis
      - TTS_SERVICE_URL=${TTS_SERVICE_URL:-http://tts-service:8000}
      # Main API for status updates
      - MAIN_API_URL=${MAIN_API_URL:-http://api:8000}
      # Redis for job queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Audio output settings
      - AUDIO_OUTPUT_FORMAT=${PODCAST_AUDIO_FORMAT:-mp3}
      - AUDIO_BITRATE=${PODCAST_AUDIO_BITRATE:-192k}
      - AUDIO_SAMPLE_RATE=${PODCAST_AUDIO_SAMPLE_RATE:-24000}
      # Default podcast settings
      - DEFAULT_LANGUAGE=${PODCAST_DEFAULT_LANGUAGE:-es-ES}
      - DEFAULT_TONE=${PODCAST_DEFAULT_TONE:-conversational}
      - DEFAULT_LENGTH=${PODCAST_DEFAULT_LENGTH:-standard}
    volumes:
      # Mount source code for development
      - ../microservices/podcast-service/app:/app/app:ro
      - ../microservices/podcast-service/config:/app/config:ro
      # Temporary audio files (cleaned after upload)
      - podcast_temp:/app/temp
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # KeyCloak - OAuth/OIDC Server for SSO
  # =============================================================================
  # Admin Console: http://localhost:8080
  # OIDC Discovery: http://localhost:8080/realms/nexus/.well-known/openid-configuration
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      # Admin credentials
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Database - use dedicated PostgreSQL for KeyCloak
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Hostname configuration
      - KC_HOSTNAME=nexus-docs360.es
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      # Health and metrics
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - backend-network
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3;cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # KeyCloak dedicated database
  keycloak-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  vllm_cache:  # Cache for LLM model (vLLM service)
  embedding_cache:  # Cache for embedding model (multimodal embeddings service)
  tts_model_cache:  # Cache for VibeVoice TTS models
  keycloak_data:  # KeyCloak PostgreSQL data
  podcast_temp:  # Temporary audio files for podcast generation
