services:
  # Servicio principal de la API - DEVELOPMENT MODE
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
     depends_on:
       db:
         condition: service_healthy
       redis:
         condition: service_healthy
       weaviate:
         condition: service_healthy
       cag-service:
         condition: service_healthy
       storage-service:
         condition: service_healthy
       gotenberg:
         condition: service_healthy
       langextract-service:
         condition: service_healthy
       elasticsearch-service:
         condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      # Unified API Key for all microservices
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
       # Services URLs
       - STORAGE_SERVICE_URL=http://storage-service:8003
       - CAG_SERVICE_URL=http://cag-service:8008
       - WEAVIATE_SERVICE_URL=http://weaviate-service:8007  # NEW: Weaviate service
       - LANGEXTRACT_SERVICE_URL=http://langextract-service:8009  # NEW: LangExtract service
       - ELASTICSEARCH_SERVICE_URL=http://elasticsearch-service:8008  # NEW: Elasticsearch service
       - TEMPORALIO_SERVICE_URL=http://temporalio-service:8010  # NEW: Temporalio service
       - TEMPLATE_EDITOR_SERVICE_URL=http://template-editor-service:8011  # NEW: Template Editor service
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - GOTENBERG_BASE_URL=http://gotenberg:3000
      # Infrastructure
      - REDIS_HOST=redis  # Cache is essential for performance
      - WEAVIATE_URL=http://weaviate:8080  # Primary Weaviate database
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Migration settings
      - ENABLE_WEAVIATE=${ENABLE_WEAVIATE:-true}  # Feature flag for Weaviate
      - MIGRATION_MODE=${MIGRATION_MODE:-parallel}  # parallel, weaviate_only, qdrant_only
      # URLs
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # General
      - DEBUG=${DEBUG:-true}
      - TESTING=${TESTING:-false}
      - ALLOW_ALL_CORS=${ALLOW_ALL_CORS:-true}
    volumes:
      - ../:/app  # Live code reloading for development
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "warning"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  # CAG microservice - DEVELOPMENT MODE (Updated: removed Qdrant dependency)
  cag-service:
    build:
      context: ../microservices/cag-service
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
          condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/nexus_db
      - SERPER_API_KEY=${SERPER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
      - DEBUG=${DEBUG:-true}  # Enable reload in dev
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/cag-service/app:/app/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Storage Microservice - DEVELOPMENT MODE
  storage-service:
    build:
      context: ../microservices/storage-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      - redis
    networks:
      - backend-network
    volumes:
      - ../../credentials:/app/credentials:ro
      # Mount the Python code for live reloading
      - ../microservices/storage-service/app:/app/app:rw
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - GCS_PROJECT_ID=nexus-document-ia
      - GCS_CREDENTIALS=/app/credentials/nexusdocs360-pre-7d2cb195adc7.json
      - GCS_BUCKET_NAME=nexus-docs-eu
      - SIGNED_URL_EXPIRATION=3600
      - MAX_UPLOAD_SIZE=104857600
      - RATE_LIMIT_PER_MINUTE=10
      - DEBUG=${DEBUG:-true}
      - TESTING=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Signature microservice
  signature-service:
    build:
      context: ../microservices/signature-service
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    networks:
      - backend-network
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/signature-service/app:/app/app:rw
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - MAIN_API_URL=http://backend:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=${DEBUG:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # LangExtract service for structured document extraction
  langextract-service:
    build:
      context: ../microservices/langextract-service
      dockerfile: Dockerfile
    container_name: langextract-service
    environment:
      - OLLAMA_HOST=http://genai-ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY:-dev-api-key-2024}
      - DEFAULT_PROVIDER=ollama
    ports:
      - "8009:8009"
    depends_on:
      - genai-ollama
    volumes:
      - ../microservices/langextract-service/app:/app/app:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gotenberg service for document conversion
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3333:3000"
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Ollama service for local LLM inference
  genai-ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    networks:
      - backend-network
    volumes:
      - genai_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      # GPU configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Primary Weaviate vector database
  weaviate:
    image: semitechnologies/weaviate:latest
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # NEW: Elasticsearch for hybrid search and analytics
  elasticsearch:
    image: elasticsearch:8.11.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"  # Optimized memory usage
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # NEW: Kibana for Elasticsearch analytics (optional)
  kibana:
    image: kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=nexus-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # NEW: Weaviate Service with Elysia (Advanced RAG)
  weaviate-service:
    build:
      context: ../microservices/weaviate-service
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      genai-ollama:
        condition: service_started
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - WEAVIATE_URL=http://weaviate:8080
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/nexus_db
      - ELYSIA_ENABLED=${ELYSIA_ENABLED:-true}
      - ELYSIA_MODEL_PROVIDER=ollama
      - ELYSIA_MODEL_NAME=${LLM_MODEL:-gpt-oss:20b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=${DEBUG:-true}
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/weaviate-service/app:/app/app:rw
    restart: unless-stopped
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 60s

   # NEW: Elasticsearch Service for hybrid search and analytics
   elasticsearch-service:
     build:
       context: ../microservices/elasticsearch-service
       dockerfile: Dockerfile
     ports:
       - "8008:8008"
     depends_on:
       elasticsearch:
         condition: service_healthy
       redis:
         condition: service_healthy
     networks:
       - backend-network
     env_file:
       - .env
     environment:
       - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
       - ELASTICSEARCH_URL=http://elasticsearch:9200
       - DEBUG=${DEBUG:-true}
     volumes:
       # Mount the Python code for live reloading
       - ../microservices/elasticsearch-service/app:/app/app:rw
     restart: unless-stopped
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 60s

   # NEW: Temporalio Server for durable workflows
  temporalio-server:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # Web UI
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_SEEDS=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    volumes:
      - temporalio_data:/etc/temporalio/config/dynamicconfig
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8233/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # NEW: Temporalio Workflows Service
  temporalio-service:
    build:
      context: ../microservices/temporalio-service
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    depends_on:
      temporalio-server:
        condition: service_healthy
      weaviate-service:
        condition: service_healthy
      genai-ollama:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - TEMPORALIO_HOST=temporalio-server
      - TEMPORALIO_PORT=7233
      - TEMPORALIO_NAMESPACE=nexus-workflows
      - TEMPORALIO_TASK_QUEUE=nexus-workflow-tasks
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/nexus_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_CORE_URL=http://api:8000
      - WEAVIATE_SERVICE_URL=http://weaviate-service:8007
      - OLLAMA_BASE_URL=http://genai-ollama:11434
      - STORAGE_SERVICE_URL=http://storage-service:8003
      - DEBUG=${DEBUG:-true}
    volumes:
      # Mount the Python code for live reloading
      - ../microservices/temporalio-service/app:/app/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # NEW: Template Editor Service for Google Docs integration (Alfresco pattern)
  template-editor-service:
    build:
      context: ../microservices/template-editor-service
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    env_file:
      - .env
    environment:
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/nexus_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=2
      - GOOGLE_CREDENTIALS_PATH=${GCS_CREDENTIALS}
      - STORAGE_SERVICE_URL=http://storage-service:8003
      - MAIN_API_URL=http://api:8000
      - DEBUG=${DEBUG:-true}
    volumes:
      # Mount Google credentials
      - ../../credentials:/app/credentials:ro
      # Mount the Python code for live reloading
      - ../microservices/template-editor-service/app:/app/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:  # Primary Weaviate data volume
  elasticsearch_data:  # NEW: Elasticsearch data volume
  temporalio_data:  # NEW: Temporalio configuration data volume
  langgraph_checkpoints:
  genai_ollama_data:
