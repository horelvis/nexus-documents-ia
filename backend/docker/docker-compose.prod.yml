version: '3.8'

services:
  # Servicio principal de la API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${REGISTRY_URL}/doc-management-api:${TAG:-latest}
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
    env_file:
      - ../.env.prod
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Knowledge Tree Service - Structural Context (Apache AGE)
  knowledge-tree-service:
    build:
      context: ../microservices/knowledge-tree-service
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/knowledge-tree-service:${TAG:-latest}
    env_file:
      - ../.env.prod
    networks:
      - backend-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx como proxy inverso
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d
      - ../nginx/ssl:/etc/nginx/ssl
      - ../nginx/logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - backend-network
      - frontend-network
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend-network:
    driver: overlay
    internal: true
  frontend-network:
    driver: overlay
