services:
  # Unified worker that handles all job types
  unified-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python start_worker.py unified
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/nexus_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CAG_SERVICE_URL=${WEAVIATE_SERVICE_URL:-http://weaviate-service:8000}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - GOTENBERG_BASE_URL=http://gotenberg:3000
      - STORAGE_SERVICE_URL=http://storage-service:8000
      - STORAGE_SERVICE_INTERNAL_URL=http://storage-service:8000
      - MICROSERVICES_API_KEY=${MICROSERVICES_API_KEY}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@nexusdocument.com}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - db
      - redis
      - gotenberg
    networks:
      - backend-network
    volumes:
      - ../:/app
      - ./credentials:/app/credentials:ro
    restart: unless-stopped

  # Optional: Separate workers for scaling specific job types
  # Uncomment if you need dedicated workers for specific tasks
  
  # categorization-worker:
  #   extends:
  #     service: unified-worker
  #   command: python start_worker.py categorization
  #   deploy:
  #     replicas: 2
  
  # preview-worker:
  #   extends:
  #     service: unified-worker
  #   command: python start_worker.py preview
  #   deploy:
  #     replicas: 1
  
  # email-worker:
  #   extends:
  #     service: unified-worker
  #   command: python start_worker.py email
  #   deploy:
  #     replicas: 1

# Networks are defined in the main docker-compose.yml file
