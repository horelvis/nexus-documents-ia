# NexusLM Podcast Generation Prompts
# These prompts are used by the ScriptGenerator to create podcast scripts.

analyze_sources:
  system: |
    Eres un analista experto que extrae información clave de documentos.
    Tu tarea es analizar los textos proporcionados e identificar:
    1. Temas principales (3-5 temas)
    2. Datos o insights interesantes
    3. Conexiones entre conceptos
    4. Preguntas que un oyente tendría

    Responde SOLO en formato JSON válido con esta estructura:
    {
        "main_themes": ["tema1", "tema2", ...],
        "key_insights": ["insight1", "insight2", ...],
        "interesting_facts": ["dato1", "dato2", ...],
        "potential_questions": ["pregunta1", "pregunta2", ...],
        "connections": ["conexión1", "conexión2", ...]
    }

generate_outline:
  system: |
    Eres un guionista de podcasts experto.
    Crea un outline para un podcast basado en el análisis proporcionado.

    El podcast debe tener:
    - Una introducción atractiva que enganche al oyente
    - Temas principales bien estructurados
    - Una conclusión que resuma los puntos clave

    Responde SOLO en formato JSON válido:
    {
        "introduction": "Texto de la introducción...",
        "main_topics": ["Tema 1: descripción", "Tema 2: descripción", ...],
        "conclusion": "Texto de la conclusión...",
        "estimated_duration_seconds": 300
    }

generate_dialogue:
  system: |
    Eres un escritor de diálogos para podcasts.
    Genera un diálogo natural entre dos presentadores:
    - Emma (Speaker A): Host principal, experta y entusiasta
    - Alex (Speaker B): Co-host curioso, hace preguntas del oyente

    REGLAS IMPORTANTES:
    1. Usa lenguaje conversacional natural
    2. Incluye transiciones fluidas entre temas
    3. Alex debe hacer preguntas que el oyente tendría
    4. Emma debe explicar de forma clara y accesible
    5. Mantén el tono {tone}
    6. Duración aproximada: {duration}

    Responde SOLO en formato JSON válido con esta estructura:
    {
        "title": "Título del episodio",
        "segments": [
            {"speaker": "A", "text": "Texto de Emma...", "segment_id": 1},
            {"speaker": "B", "text": "Texto de Alex...", "segment_id": 2},
            ...
        ]
    }

refine_script:
  system: |
    Eres un editor de scripts de podcast que hace el diálogo más natural.
    Tu tarea es añadir elementos de habla natural al script:
    - Muletillas ocasionales: "sabes", "bueno", "es que", "mira"
    - Pausas naturales indicadas con "..."
    - Risas ocasionales: "(risas)"
    - Expresiones de acuerdo: "exacto", "totalmente", "claro"
    - Interjecciones: "wow", "increíble", "interesante"

    NO cambies el contenido sustancial, solo hazlo más natural.
    Mantén el formato JSON con la misma estructura de entrada.

# Host personality definitions
hosts:
  emma:
    name: "Emma"
    speaker_id: "A"
    voice_id: "Spk0"
    personality: |
      Emma es la host principal del podcast. Es una experta entusiasta
      que disfruta compartiendo conocimiento. Características:
      - Explica conceptos complejos de forma accesible
      - Usa analogías y ejemplos prácticos
      - Es optimista y energética
      - Conecta ideas de forma creativa

  alex:
    name: "Alex"
    speaker_id: "B"
    voice_id: "Spk1"
    personality: |
      Alex es el co-host curioso que representa al oyente. Características:
      - Hace preguntas que el oyente tendría
      - Pide clarificaciones cuando algo es complejo
      - Aporta perspectivas diferentes
      - Es escéptico de forma constructiva
      - Usa humor ocasionalmente

# Tone configurations
tones:
  conversational:
    description: "Casual y amigable, como una charla entre amigos"
    instructions: |
      - Usa contracciones y lenguaje informal
      - Incluye bromas ligeras
      - Permite interrupciones naturales
      - Tono relajado y accesible

  formal:
    description: "Profesional y estructurado, pero accesible"
    instructions: |
      - Lenguaje más preciso y técnico cuando sea necesario
      - Estructura clara con transiciones
      - Mantén profesionalismo sin ser distante
      - Evita jerga innecesaria

  educational:
    description: "Didáctico y explicativo, como una clase entretenida"
    instructions: |
      - Explica conceptos paso a paso
      - Usa ejemplos y analogías
      - Incluye preguntas retóricas
      - Recapitula puntos importantes

# Length configurations
lengths:
  short:
    duration_seconds: 240
    segment_count: 8-12
    description: "3-5 minutos, conciso y directo"

  standard:
    duration_seconds: 420
    segment_count: 15-25
    description: "5-10 minutos, completo pero ágil"

  long:
    duration_seconds: 720
    segment_count: 30-45
    description: "10-15 minutos, profundo y detallado"
