      - LOSU - Ley Orgánica 2/2023 del Sistema Universitario (BOE-A-2023-7500)
      - RD 217/2022 de ordenación de ESO (BOE-A-2022-4975)
      - RD 243/2022 de ordenación de Bachillerato (BOE-A-2022-5139)
