# Medical Sector QA Concepts
# Maps natural language medical queries to domains, related regulations,
# and graph keywords for knowledge expansion.

concepts:
  - id: consentimiento_informado
    domain: general
    description: "Consentimiento informado del paciente antes de procedimientos médicos"
    questions:
      - "modelo consentimiento informado"
      - "requisitos consentimiento informado"
      - "cuándo es obligatorio el consentimiento informado"
      - "consentimiento informado cirugía"
      - "revocación consentimiento informado"
    related_laws:
      - "Ley 41/2002 autonomía del paciente Art. 8-10"
    graph_keywords:
      - consentimiento informado
      - autonomía paciente
      - procedimiento

  - id: historia_clinica
    domain: general
    description: "Historia clínica: contenido, acceso, conservación y protección de datos"
    questions:
      - "contenido historia clínica"
      - "acceso historia clínica paciente"
      - "conservación historia clínica"
      - "protección datos historia clínica"
      - "quién puede acceder a la historia clínica"
    related_laws:
      - "Ley 41/2002 autonomía del paciente Art. 14-19"
      - "RGPD Art. 9"
    graph_keywords:
      - historia clínica
      - datos salud
      - acceso

  - id: responsabilidad_medica
