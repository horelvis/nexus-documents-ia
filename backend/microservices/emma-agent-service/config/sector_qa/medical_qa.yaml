      - "mala praxis médica"
      - "reclamación negligencia médica"
      - "indemnización error médico"
      - "responsabilidad patrimonial sanitaria"
    related_laws:
      - "Ley 41/2002"
      - "Ley 40/2015 Régimen Jurídico Sector Público"
    graph_keywords:
      - negligencia médica
      - mala praxis
      - responsabilidad sanitaria

