# Documental Sector QA Concepts
# Maps natural language document management queries to domains,
# related standards, and graph keywords.

concepts:
  - id: gestion_documental
    domain: general
    description: "Gestión documental: organización, clasificación y ciclo de vida de documentos"
    questions:
      - "cómo organizar documentos empresa"
      - "sistema gestión documental"
      - "clasificación documental"
      - "ciclo de vida documento"
      - "cuadro clasificación documentos"
      - "política gestión documental"
    related_laws:
      - "ISO 15489 Gestión de documentos"
      - "Ley 39/2015 Procedimiento Administrativo"
    graph_keywords:
      - gestión documental
      - clasificación
      - ciclo de vida

