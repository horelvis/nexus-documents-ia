# Legal Sector QA Concepts
# Each concept maps natural language questions to legal domains,
# related laws, and graph keywords for expansion.
#
# Fields:
#   id: Unique concept identifier
#   domain: Agent routing hint (labor, fiscal, civil, contract, compliance, privacy)
#   description: Concept summary (used as training target for fine-tuning)
#   questions: Natural language queries that map to this concept
#   related_laws: Laws/articles for public knowledge search (BOE)
#   graph_keywords: Keywords for Apache AGE Cypher expansion

concepts:
  # =========================================================================
  # LABORAL — Despido
  # =========================================================================
  - id: despido_disciplinario
    domain: labor
    description: "Despido disciplinario por incumplimiento grave del trabajador según el Estatuto de los Trabajadores"
    questions:
      - "redactar carta de despido disciplinario"
      - "despido disciplinario por ausencias injustificadas"
      - "carta de despido por faltas de asistencia"
      - "modelo carta despido disciplinario"
      - "cómo despedir a un empleado por faltas graves"
      - "despido por incumplimiento contractual"
      - "despido por indisciplina o desobediencia"
      - "causas de despido disciplinario"
      # Terminología profesional — variaciones de consulta jurídica
      - "extinción contractual por ausencias reiteradas sin justificación"
      - "procedimiento disciplinario por absentismo laboral"
      - "carta de despido por transgresión de la buena fe contractual"
      - "calificación jurídica de las faltas de asistencia reiteradas"
      - "requisitos formales del despido disciplinario ex art. 54 ET"
      - "plazo de caducidad para impugnar despido disciplinario"
    related_laws:
      - "Estatuto de los Trabajadores Art. 54"
      - "Estatuto de los Trabajadores Art. 55"
      - "Real Decreto Legislativo 2/2015"
    graph_keywords:
      - despido
      - disciplinario
      - ausencia injustificada
      - incumplimiento grave
      - falta de asistencia

