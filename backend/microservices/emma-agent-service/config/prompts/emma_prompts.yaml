    - "evaluación"
    - "extrae"
    - "extraer"
    - "extracción"
    - "identifica"
    - "identificar"
    - "verifica"
    - "verificar"
    - "comprueba"
    - "comprobar"
    - "riesgos"
    - "cláusulas"
    - "problemas"
    - "cumplimiento"
    - "compara"
    - "comparar"
    - "comparación"
    - "diferencias"
    # Spanish - document-specific phrases
