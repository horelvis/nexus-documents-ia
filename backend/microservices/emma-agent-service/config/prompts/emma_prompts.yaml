        "doc1_text": "Texto en documento 1",
        "doc2_text": "Texto en documento 2",
        "analysis": "Implicación de la diferencia"
      }
    ],
    "similarities": [
      {
        "aspect": "Aspecto similar",
        "description": "Descripción de la similitud"
      }
    ],
    "recommendations": [
      {
        "title": "Recomendación",
        "description": "Acción sugerida basada en la comparación"
      }
    ]
  }


