    Tipos de factores válidos: regulatory_compliance, standard_adherence, completeness, accuracy, timeliness

    REGLAS:
    - Extrae UN solo factor por llamada
    - El factor debe ser específico y basado en el documento analizado
    - Incluye la normativa, estándar o regulación relevante si es identificable
    - NO repitas factores ya extraídos
    - Responde SOLO con JSON válido, sin texto adicional
    - NO uses etiquetas <think>

  user: |
    DESCRIPCIÓN DEL DOCUMENTO/INFORME:
    {case_description}

    FACTORES YA EXTRAÍDOS:
    {previous_factors}

    FUENTE ADICIONAL (si disponible):
