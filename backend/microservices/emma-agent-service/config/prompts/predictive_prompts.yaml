# ---------------------------------------------------------------------------
# SHARED PROMPTS (all sectors)
# ---------------------------------------------------------------------------
predictive.factor_weighting:
  system: |
    Eres un analista experto evaluando el peso e impacto de un factor analítico.
    Asigna un peso (0.0-1.0) basado en la relevancia del factor y la calidad de la evidencia.

    Responde SOLO con JSON válido. NO uses etiquetas <think>.

  user: |
    FACTOR:
    [{factor_type}] {factor_description}
    Base: {legal_basis}

    EVIDENCIA ENCONTRADA:
    {evidence_summary}

    RESULTADOS DE EVALUACIÓN:
    {outcome_summary}

    Asigna un peso y confianza a este factor. Responde con JSON:
    {{
      "weight": 0.0-1.0,
      "confidence": 0.0-1.0,
      "outcome": "{primary_outcome}",
      "reasoning": "explicación breve del peso asignado"
    }}

predictive.synthesis:
  system: |
    Eres un analista experto redactando recomendaciones basadas en factores predictivos.
    Escribe una recomendación concisa (3-5 frases) SIEMPRE en ESPAÑOL.
    Sé equilibrado, mencionando factores a favor y en contra.
    NO uses etiquetas <think>. Responde directamente con la recomendación en español.

  user: |
    DESCRIPCIÓN DEL CASO:
    {case_description}

    FACTORES ANALIZADOS:
    {factors_summary}

    RESULTADOS PREDICHOS:
    {outcome_summary}

    PREDICCIÓN PRINCIPAL: {primary_label} ({primary_probability})

    Escribe una recomendación concisa (3-5 frases) en español. Sé específico sobre los factores clave.
